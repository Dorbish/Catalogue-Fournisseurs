<style>
/* =====================================================
   style.css — Catalogue Fournisseurs · Charte Elior
   Design clair, professionnel, sobre
   ===================================================== */

@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;500;600&display=swap');

/* ── VARIABLES ELIOR ── */
:root {
  --primary:      #1B6B8A;
  --primary-dk:   #154F66;
  --primary-lt:   #E8F4F8;
  --primary-mid:  #1a8aaa;
  --white:        #FFFFFF;
  --bg-light:     #F7F8FA;
  --bg-dark:      #2B2B2B;
  --text-dark:    #1A1A1A;
  --text-mid:     #555555;
  --text-light:   #888888;
  --border:       #E0E0E0;
  --success:      #2E9E5B;
  --warning:      #E8A020;
  --danger:       #D94040;
  --card-shadow:  0 2px 12px rgba(0,0,0,.08);
  --card-shadow-h:0 8px 24px rgba(0,0,0,.14);
  --r:            10px;
  --r-sm:         6px;
  --r-pill:       25px;
  --font-title:   'Montserrat', sans-serif;
  --font-body:    'Open Sans', sans-serif;
  --max-w:        1260px;
  --trans:        .2s ease;
}

/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background: var(--bg-light);
  color: var(--text-dark);
  min-height: 100vh;
  line-height: 1.7;
  font-size: 1rem;
}
button { cursor: pointer; font-family: inherit; }
input, select { font-family: inherit; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
img { max-width: 100%; display: block; }

/* ── ÉCRAN DE CHARGEMENT ── */
#loading-screen {
  position: fixed; inset: 0;
  background: var(--white);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 9999; transition: opacity .4s ease;
}
#loading-screen.hidden { opacity: 0; pointer-events: none; }
.loading-logo { margin-bottom: 16px; }
.loading-logo img { height: 48px; }
.loading-title { font-family: var(--font-title); font-size: 1rem; font-weight: 600; color: var(--text-mid); margin-bottom: 24px; }
.loading-bar-wrap { width: 280px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.loading-bar { height: 100%; width: 0; background: var(--primary); border-radius: 2px; transition: width .4s ease; }
.loading-text { margin-top: 12px; font-size: .8rem; color: var(--text-light); }

/* ── BANNIÈRE ERREURS ── */
#error-banner {
  position: fixed; top: 72px; right: 16px; z-index: 8000;
  display: flex; flex-direction: column; gap: 6px; max-width: 360px;
}
.error-item {
  background: #fff3f3; border: 1px solid #f5c6c6; border-radius: var(--r-sm);
  padding: 10px 14px; font-size: .78rem; color: var(--danger);
  display: flex; align-items: flex-start; gap: 8px;
}

/* ── HEADER ── */
#header {
  background: var(--white);
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  height: 64px; padding: 0 28px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 500;
}
.header-logo img { height: 38px; }
.header-nav { display: flex; align-items: center; gap: 8px; }
.header-stats { display: flex; gap: 8px; margin-right: 12px; }
.stat-chip {
  background: var(--primary-lt); color: var(--primary);
  border: 1px solid rgba(27,107,138,.2); border-radius: var(--r-pill);
  padding: 4px 12px; font-size: .75rem; font-family: var(--font-title); font-weight: 600;
}
.stat-chip b { font-weight: 800; }

/* ── BOUTONS GLOBAUX ── */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  border-radius: var(--r-pill); padding: 9px 22px;
  font-family: var(--font-title); font-size: .84rem; font-weight: 600;
  letter-spacing: .3px; transition: all var(--trans); border: 2px solid transparent;
  white-space: nowrap; cursor: pointer; text-decoration: none;
}
.btn-primary {
  background: var(--primary); color: var(--white); border-color: var(--primary);
}
.btn-primary:hover { background: var(--primary-dk); border-color: var(--primary-dk); transform: translateY(-1px); text-decoration: none; color: var(--white); }
.btn-secondary {
  background: transparent; color: var(--primary); border-color: var(--primary);
}
.btn-secondary:hover { background: var(--primary-lt); transform: translateY(-1px); text-decoration: none; }
.btn-sm { padding: 6px 16px; font-size: .78rem; }
.btn-icon { width: 36px; height: 36px; padding: 0; justify-content: center; border-radius: 50%; }

/* ── TOPBAR RECHERCHE + ONGLETS ── */
#topbar {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 10px 28px;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  position: sticky; top: 64px; z-index: 490;
  box-shadow: 0 1px 4px rgba(0,0,0,.04);
}

/* Recherche */
.search-wrap { flex: 1; min-width: 260px; position: relative; }
.search-wrap svg {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--text-light); pointer-events: none;
}
#search-input {
  width: 100%; background: var(--white);
  border: 2px solid var(--border); border-radius: var(--r-pill);
  padding: 10px 40px 10px 42px;
  color: var(--text-dark); font-size: .9rem; outline: none;
  transition: border-color var(--trans), box-shadow var(--trans);
}
#search-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-lt);
}
#search-input::placeholder { color: var(--text-light); }
#btn-clear {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--text-light); font-size: 1rem;
  padding: 2px 5px; border-radius: 50%; display: none; line-height: 1;
}
#btn-clear:hover { color: var(--text-dark); background: var(--bg-light); }

/* Tri */
#sort-select {
  background: var(--white); border: 2px solid var(--border); border-radius: var(--r-pill);
  padding: 9px 14px; color: var(--text-dark); font-size: .84rem; outline: none; cursor: pointer;
  transition: border-color var(--trans);
}
#sort-select:focus { border-color: var(--primary); }

/* Boutons onglets de section */
.nav-tab {
  display: inline-flex; align-items: center; gap: 7px;
  border-radius: var(--r-pill); padding: 9px 18px;
  font-family: var(--font-title); font-size: .82rem; font-weight: 600;
  border: 2px solid var(--border); background: var(--white); color: var(--text-mid);
  transition: all var(--trans); white-space: nowrap; cursor: pointer;
}
.nav-tab:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-lt); }
.nav-tab.active { background: var(--primary); color: var(--white); border-color: var(--primary); }
.nav-tab .tab-badge {
  background: rgba(255,255,255,.25); border-radius: 10px;
  padding: 1px 7px; font-size: .72rem; font-weight: 700;
}
.nav-tab.active .tab-badge { background: rgba(255,255,255,.3); }

#btn-calc {
  display: none; align-items: center; gap: 7px;
  background: var(--success); color: var(--white); border: none;
  border-radius: var(--r-pill); padding: 9px 18px;
  font-family: var(--font-title); font-size: .82rem; font-weight: 700;
}
#btn-calc:hover { opacity: .88; transform: translateY(-1px); }

/* ── DRAWERS ── */
.drawer {
  background: var(--white);
  border-bottom: 2px solid var(--border);
  box-shadow: 0 6px 24px rgba(0,0,0,.08);
  max-height: 0; overflow: hidden;
  transition: max-height .4s cubic-bezier(.4,0,.2,1);
  position: sticky; z-index: 480;
}
.drawer.open { max-height: calc(100vh - 130px); height: calc(100vh - 130px); }
#drawer-codes   { top: 130px; }
#drawer-asst    { top: 130px; z-index: 479; }
#drawer-recipes { top: 130px; z-index: 478; }
#drawer-libs    { top: 130px; z-index: 477; }
.drawer-inner {
  padding: 22px 28px 24px; overflow-y: auto;
  height: 100%; max-height: calc(100vh - 130px);
}
.drawer-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; flex-wrap: wrap; gap: 12px;
}
.drawer-header h2 {
  font-family: var(--font-title); font-size: 1rem; font-weight: 700; color: var(--text-dark);
}

/* Onglets filtre dans les drawers */
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.ftab {
  padding: 5px 14px; border-radius: var(--r-pill); font-size: .78rem; font-weight: 600;
  cursor: pointer; border: 1.5px solid var(--border); color: var(--text-mid);
  background: var(--white); transition: all .15s; white-space: nowrap;
  font-family: var(--font-title);
}
.ftab:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-lt); }
.ftab.active { background: var(--primary); border-color: var(--primary); color: var(--white); }
.ftab-sep { font-size: .78rem; color: var(--text-light); padding: 0 4px; }

/* Input recherche dans drawer */
.drw-search-wrap { position: relative; }
.drw-search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-light); pointer-events: none; }
.drw-search {
  background: var(--bg-light); border: 1.5px solid var(--border); border-radius: var(--r-pill);
  padding: 8px 14px 8px 36px; color: var(--text-dark); font-size: .84rem; outline: none;
  width: 240px; transition: border-color var(--trans);
}
.drw-search:focus { border-color: var(--primary); }
.drw-search::placeholder { color: var(--text-light); }

/* ── LAYOUT PRINCIPAL ── */
.main-layout { display: flex; min-height: calc(100vh - 130px); }

/* Sidebar fournisseurs */
#sidebar {
  width: 280px; flex-shrink: 0;
  background: var(--white); border-right: 1px solid var(--border);
  overflow-y: auto; max-height: calc(100vh - 130px);
  position: sticky; top: 130px; align-self: flex-start;
}
.sidebar-section-title {
  font-family: var(--font-title); font-size: .68rem; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase; color: var(--text-light);
  padding: 14px 18px 8px; border-bottom: 1px solid var(--border);
}
.sidebar-item {
  padding: 10px 18px; cursor: pointer; font-size: .84rem; color: var(--text-mid);
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  border-left: 3px solid transparent; transition: all .15s;
  border-bottom: 1px solid rgba(224,224,224,.4);
}
.sidebar-item:hover { background: var(--primary-lt); color: var(--primary); border-left-color: var(--primary-lt); }
.sidebar-item.active { border-left-color: var(--primary); background: var(--primary-lt); color: var(--primary); font-weight: 600; }
.sidebar-item .sup-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidebar-count {
  background: var(--bg-light); border: 1px solid var(--border);
  border-radius: var(--r-pill); padding: 1px 8px;
  font-size: .7rem; font-family: 'Courier New', monospace; color: var(--text-light); flex-shrink: 0;
}
.sidebar-item.active .sidebar-count { background: var(--primary); border-color: var(--primary); color: var(--white); }

/* Zone contenu */
#content { flex: 1; padding: 22px 28px; min-width: 0; }
.results-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.results-info { font-size: .85rem; color: var(--text-mid); }
.results-info em { color: var(--primary); font-style: normal; font-weight: 600; font-family: var(--font-title); }

/* ── GRILLE PRODUITS ── */
.products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(262px, 1fr)); gap: 14px; }

.product-card {
  background: var(--white); border: 1px solid var(--border); border-radius: var(--r);
  padding: 16px; display: flex; flex-direction: column; gap: 10px;
  box-shadow: var(--card-shadow);
  transition: transform var(--trans), box-shadow var(--trans);
}
.product-card:hover { transform: translateY(-3px); box-shadow: var(--card-shadow-h); }

.card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.supplier-badge {
  background: var(--primary-lt); color: var(--primary); border-radius: var(--r-pill);
  padding: 3px 10px; font-size: .73rem; font-family: var(--font-title); font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;
}
.fav-btn { background: none; border: none; font-size: 1.1rem; color: var(--text-light); padding: 3px; border-radius: 50%; flex-shrink: 0; transition: color var(--trans); }
.fav-btn:hover, .fav-btn.active { color: var(--warning); }

.card-name { font-family: var(--font-title); font-size: .88rem; font-weight: 600; color: var(--text-dark); line-height: 1.35; min-height: 36px; }
.card-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.meta-label { font-size: .62rem; text-transform: uppercase; letter-spacing: .5px; color: var(--text-light); font-weight: 600; }
.meta-value { font-size: .78rem; color: var(--text-mid); font-family: 'Courier New', monospace; }
.card-price { font-family: var(--font-title); font-size: 1rem; font-weight: 700; color: var(--primary); }
.card-price .unit { font-size: .72rem; font-weight: 400; color: var(--text-light); }
.no-price { font-size: .8rem; color: var(--text-light); font-style: italic; }

.code-badge {
  display: inline-block; background: var(--primary-lt); color: var(--primary);
  border-radius: var(--r-sm); padding: 2px 8px;
  font-family: 'Courier New', monospace; font-size: .72rem; font-weight: 600;
}
.lib-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.lib-tag { font-size: .67rem; padding: 2px 8px; border-radius: var(--r-pill); font-family: var(--font-title); font-weight: 600; white-space: nowrap; }

/* ── PAGINATION ── */
.pagination { display: flex; justify-content: center; gap: 6px; margin-top: 28px; flex-wrap: wrap; padding-bottom: 24px; }
.page-btn {
  background: var(--white); border: 1.5px solid var(--border); color: var(--text-mid);
  border-radius: var(--r-pill); padding: 6px 14px; font-family: var(--font-title); font-size: .82rem;
  transition: all .15s;
}
.page-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-lt); }
.page-btn.active { background: var(--primary); border-color: var(--primary); color: var(--white); font-weight: 700; }
.page-dots { color: var(--text-light); padding: 6px 2px; align-self: center; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); grid-column: 1/-1; }
.empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }
.empty-state h3 { font-family: var(--font-title); font-size: .95rem; color: var(--text-mid); font-weight: 600; }

/* ── CODES ARTICLES ── */
.codes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr)); gap: 10px; margin-top: 12px; }
.code-card {
  background: var(--white); border: 1px solid var(--border); border-radius: var(--r);
  padding: 12px 14px; display: flex; align-items: flex-start; gap: 10px;
  cursor: pointer; transition: all .15s; box-shadow: var(--card-shadow);
}
.code-card:hover { border-color: var(--primary); background: var(--primary-lt); transform: translateY(-2px); box-shadow: var(--card-shadow-h); }
.code-info { flex: 1; min-width: 0; }
.code-name { font-family: var(--font-title); font-size: .82rem; font-weight: 600; color: var(--text-dark); line-height: 1.3; margin-bottom: 4px; }
.code-ref  { font-family: 'Courier New', monospace; font-size: .72rem; color: var(--primary); background: var(--primary-lt); border-radius: var(--r-sm); display: inline-block; padding: 1px 6px; margin-bottom: 3px; }
.code-fourn{ font-size: .72rem; color: var(--text-light); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.code-fav  { background: none; border: none; font-size: 1rem; color: var(--text-light); padding: 2px; flex-shrink: 0; transition: color var(--trans); }
.code-fav:hover, .code-fav.active { color: var(--warning); }

/* ── ASSORTIMENT ── */
.asst-legend { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; padding: 10px 14px; background: var(--bg-light); border-radius: var(--r); border: 1px solid var(--border); font-size: .78rem; color: var(--text-mid); }
.asst-legend span { display: flex; align-items: center; gap: 7px; font-weight: 600; }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

.asst-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-top: 12px; }
.asst-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--card-shadow); transition: transform var(--trans), box-shadow var(--trans); }
.asst-card:hover { transform: translateY(-2px); box-shadow: var(--card-shadow-h); }
.asst-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
.asst-name { font-family: var(--font-title); font-size: .84rem; font-weight: 700; color: var(--text-dark); line-height: 1.3; flex: 1; }
.badge-gamme { font-size: .65rem; padding: 2px 8px; border-radius: var(--r-pill); white-space: nowrap; flex-shrink: 0; font-family: var(--font-title); font-weight: 600; }
.badge-gamme.perm { background: rgba(46,158,91,.12); color: var(--success); border: 1px solid rgba(46,158,91,.25); }
.badge-gamme.sais { background: rgba(232,160,32,.12); color: var(--warning); border: 1px solid rgba(232,160,32,.25); }
.asst-sub  { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.badge-cat { font-size: .68rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: .4px; font-family: var(--font-title); }
.badge-prot { font-size: .68rem; padding: 2px 7px; border-radius: var(--r-pill); font-family: var(--font-title); font-weight: 600; }
.badge-prot.vol { background: rgba(232,160,32,.12); color: var(--warning); }
.badge-prot.veg { background: rgba(46,158,91,.12);  color: var(--success); }
.badge-prot.poi { background: var(--primary-lt);    color: var(--primary); }
.badge-prot.por { background: rgba(217,64,64,.1);   color: var(--danger); }
.asst-divider { border: none; border-top: 1px solid var(--border); }
.asst-prices { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.aprice { display: flex; flex-direction: column; align-items: center; background: var(--bg-light); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 5px 6px; }
.aprice-lbl { font-size: .6rem; text-transform: uppercase; letter-spacing: .5px; color: var(--text-light); font-weight: 700; margin-bottom: 2px; }
.aprice-val { font-size: .82rem; font-weight: 700; font-family: var(--font-title); color: var(--text-dark); }
.ratio-row  { display: flex; align-items: center; gap: 8px; }
.ratio-lbl  { font-size: .7rem; color: var(--text-light); white-space: nowrap; font-weight: 600; }
.ratio-bar  { flex: 1; height: 7px; background: var(--bg-light); border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
.ratio-fill { height: 100%; border-radius: 4px; }
.ratio-val  { font-size: .78rem; font-family: var(--font-title); font-weight: 700; white-space: nowrap; }
.acout      { font-size: .72rem; color: var(--text-light); text-align: right; }

/* ── FICHES RECETTES ── */
.recipes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); gap: 12px; margin-top: 12px; }
.recipe-card {
  background: var(--white); border: 1px solid var(--border); border-radius: var(--r);
  padding: 14px; display: flex; flex-direction: column; gap: 8px;
  box-shadow: var(--card-shadow); transition: transform var(--trans), box-shadow var(--trans);
}
.recipe-card:hover { transform: translateY(-2px); box-shadow: var(--card-shadow-h); }
.recipe-card.selected { border-color: var(--primary); background: var(--primary-lt); }
.recipe-card-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.recipe-cat { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--primary); background: var(--primary-lt); border-radius: var(--r-pill); padding: 3px 10px; white-space: nowrap; font-family: var(--font-title); }
.recipe-portions { font-size: .72rem; color: var(--text-light); font-family: var(--font-title); font-weight: 600; white-space: nowrap; }
.recipe-name { font-family: var(--font-title); font-size: .88rem; font-weight: 700; color: var(--text-dark); line-height: 1.3; }
.recipe-preview { font-size: .75rem; color: var(--text-light); line-height: 1.5; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.recipe-actions { display: flex; gap: 8px; margin-top: 4px; }
.btn-fiche { flex: 1; background: var(--primary-lt); border: 1.5px solid rgba(27,107,138,.2); border-radius: var(--r-pill); padding: 6px 12px; color: var(--primary); font-family: var(--font-title); font-size: .76rem; font-weight: 600; text-align: center; transition: all .2s; cursor: pointer; }
.btn-fiche:hover { background: var(--primary); color: var(--white); border-color: var(--primary); }
.btn-select { flex: 1; background: var(--bg-light); border: 1.5px solid var(--border); border-radius: var(--r-pill); padding: 6px 12px; color: var(--text-mid); font-family: var(--font-title); font-size: .76rem; font-weight: 600; text-align: center; transition: all .2s; cursor: pointer; }
.btn-select.active { background: var(--success); border-color: var(--success); color: var(--white); }
.btn-select:hover  { border-color: var(--success); color: var(--success); }

/* ── MODAL FICHE RECETTE ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 1000;
  display: none; align-items: flex-start; justify-content: center;
  padding: 24px 16px; overflow-y: auto;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--white); border: 1px solid var(--border); border-radius: var(--r);
  width: 100%; max-width: 740px; animation: popIn .2s ease; margin: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}
@keyframes popIn { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.modal-head {
  padding: 20px 24px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; gap: 14px;
  background: var(--primary); border-radius: var(--r) var(--r) 0 0;
}
.modal-head-info { flex: 1; min-width: 0; }
.modal-title { font-family: var(--font-title); font-size: 1.1rem; font-weight: 800; color: var(--white); margin-bottom: 8px; line-height: 1.3; }
.modal-badges { display: flex; gap: 8px; flex-wrap: wrap; }
.modal-badge { font-size: .74rem; padding: 3px 10px; border-radius: var(--r-pill); font-weight: 600; font-family: var(--font-title); }
.modal-close { background: rgba(255,255,255,.2); border: none; color: var(--white); font-size: 1rem; width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.modal-close:hover { background: rgba(255,255,255,.3); }

.modal-body { padding: 22px 24px; }
.modal-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
.mstat { background: var(--bg-light); border: 1px solid var(--border); border-radius: var(--r); padding: 10px 14px; text-align: center; }
.mstat-lbl { font-size: .64rem; text-transform: uppercase; letter-spacing: .5px; color: var(--text-light); font-weight: 700; margin-bottom: 4px; font-family: var(--font-title); }
.mstat-val { font-family: var(--font-title); font-size: .95rem; font-weight: 800; color: var(--primary); }

.section-title { font-family: var(--font-title); font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--text-light); margin-bottom: 10px; }
.ingr-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.ingr-table th { font-family: var(--font-title); font-size: .68rem; text-transform: uppercase; letter-spacing: .5px; color: var(--white); background: var(--primary); padding: 9px 12px; text-align: left; }
.ingr-table td { font-size: .82rem; padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--text-mid); }
.ingr-table tr:last-child td { border-bottom: none; }
.ingr-table tbody tr:hover td { background: var(--primary-lt); }
.ingr-name { color: var(--text-dark); font-weight: 600; font-family: var(--font-title); }
.ingr-code { font-family: 'Courier New', monospace; font-size: .74rem; background: var(--primary-lt); color: var(--primary); padding: 2px 6px; border-radius: var(--r-sm); }
.ingr-weight{ font-weight: 700; color: var(--primary); font-family: var(--font-title); }

.badge-storage { font-size: .65rem; padding: 2px 7px; border-radius: var(--r-pill); white-space: nowrap; font-family: var(--font-title); font-weight: 600; }
.badge-storage.frais    { background: var(--primary-lt); color: var(--primary); }
.badge-storage.surgele  { background: rgba(46,158,91,.1); color: var(--success); }
.badge-storage.ambiant  { background: rgba(232,160,32,.1); color: var(--warning); }

.btn-catalogue { display: inline-flex; align-items: center; gap: 5px; background: var(--primary-lt); border: 1px solid rgba(27,107,138,.2); border-radius: var(--r-pill); padding: 4px 10px; color: var(--primary); font-family: var(--font-title); font-size: .74rem; font-weight: 600; transition: all .2s; cursor: pointer; }
.btn-catalogue:hover { background: var(--primary); color: var(--white); }

.steps-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.steps-list li { display: flex; gap: 12px; align-items: flex-start; font-size: .84rem; color: var(--text-mid); line-height: 1.5; }
.step-num { width: 24px; height: 24px; border-radius: 50%; background: var(--primary); color: var(--white); font-family: var(--font-title); font-size: .72rem; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }

/* ── CALCULATEUR ── */
.calc-box { background: var(--white); border: 1px solid var(--border); border-radius: var(--r); width: 100%; max-width: 800px; animation: popIn .2s ease; margin: auto; box-shadow: 0 20px 60px rgba(0,0,0,.2); overflow: hidden; }
.calc-head { background: var(--primary); padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; }
.calc-head h2 { font-family: var(--font-title); font-size: 1rem; font-weight: 700; color: var(--white); }
.calc-body { padding: 22px 24px; }
.calc-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.calc-table th { font-family: var(--font-title); font-size: .68rem; text-transform: uppercase; letter-spacing: .5px; color: var(--white); background: var(--primary); padding: 9px 12px; text-align: left; }
.calc-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: .83rem; color: var(--text-mid); }
.qty-input { width: 70px; background: var(--bg-light); border: 1.5px solid var(--border); border-radius: var(--r-sm); padding: 6px 8px; color: var(--text-dark); font-family: var(--font-title); font-size: .85rem; outline: none; text-align: center; }
.qty-input:focus { border-color: var(--primary); }
.btn-rm { background: none; border: none; color: var(--text-light); font-size: .9rem; padding: 3px 6px; border-radius: var(--r-sm); transition: all .15s; }
.btn-rm:hover { background: rgba(217,64,64,.1); color: var(--danger); }
.btn-compute { width: 100%; background: var(--primary); border: none; border-radius: var(--r-pill); padding: 12px; color: var(--white); font-family: var(--font-title); font-size: .9rem; font-weight: 700; letter-spacing: .3px; margin-bottom: 8px; transition: background var(--trans); }
.btn-compute:hover { background: var(--primary-dk); }
.calc-result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; margin-top: 16px; }
.calc-result-label { font-family: var(--font-title); font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-light); }
.btn-pdf { background: var(--success); border: none; border-radius: var(--r-pill); padding: 7px 18px; color: var(--white); font-family: var(--font-title); font-size: .8rem; font-weight: 700; transition: opacity var(--trans); }
.btn-pdf:hover { opacity: .85; }

/* ── BIBLIOTHÈQUES ── */
.libs-top   { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.libs-top h2{ font-family: var(--font-title); font-size: 1rem; font-weight: 700; flex: 1; }
.libs-new   { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; padding: 14px 16px; background: var(--bg-light); border-radius: var(--r); border: 1px solid var(--border); flex-wrap: wrap; }
.libs-new input { flex: 1; min-width: 160px; background: var(--white); border: 1.5px solid var(--border); border-radius: var(--r-pill); padding: 8px 14px; color: var(--text-dark); font-size: .84rem; outline: none; transition: border-color var(--trans); }
.libs-new input:focus { border-color: var(--primary); }
.color-row  { display: flex; gap: 7px; flex-wrap: wrap; }
.cswatch    { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: all .15s; flex-shrink: 0; }
.cswatch.active { border-color: var(--text-dark); transform: scale(1.2); }

.lib-section { margin-bottom: 8px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--border); }
.lib-section-head { display: flex; align-items: center; gap: 10px; padding: 11px 14px; cursor: pointer; background: var(--bg-light); transition: background .15s; user-select: none; }
.lib-section-head:hover { background: var(--primary-lt); }
.lib-dot    { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
.lib-name   { flex: 1; font-family: var(--font-title); font-size: .88rem; font-weight: 700; color: var(--text-dark); }
.lib-count  { font-size: .72rem; font-family: var(--font-title); font-weight: 600; color: var(--text-light); background: var(--white); border: 1px solid var(--border); border-radius: var(--r-pill); padding: 1px 8px; }
.lib-arrow  { font-size: .65rem; color: var(--text-light); transition: transform .2s; }
.lib-arrow.open { transform: rotate(90deg); }
.lib-body   { display: none; background: var(--white); }
.lib-body.open { display: block; }
.lib-prod-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--border); cursor: pointer; transition: background .15s; }
.lib-prod-row:hover { background: var(--primary-lt); }
.lib-bar    { width: 4px; border-radius: 2px; min-height: 38px; flex-shrink: 0; margin-top: 2px; }
.lib-prod-info { flex: 1; min-width: 0; }
.lib-prod-name { font-family: var(--font-title); font-size: .82rem; color: var(--text-dark); font-weight: 600; line-height: 1.3; }
.lib-prod-meta { font-size: .71rem; color: var(--text-light); margin-top: 2px; }
.lib-prod-price{ font-size: .76rem; color: var(--primary); font-family: var(--font-title); font-weight: 700; margin-top: 2px; }
.lib-prod-rm { background: none; border: none; color: var(--text-light); font-size: .8rem; padding: 3px 7px; border-radius: var(--r-sm); transition: all .15s; margin-top: 2px; }
.lib-prod-rm:hover { background: rgba(217,64,64,.1); color: var(--danger); }
.libs-empty { font-size: .8rem; color: var(--text-light); padding: 12px 14px; font-style: italic; }

/* ── POPUP FAVORIS ── */
.pop-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 900; display: none; align-items: center; justify-content: center; padding: 16px; }
.pop-overlay.open { display: flex; }
.pop-box { background: var(--white); border: 1px solid var(--border); border-radius: var(--r); padding: 22px; width: 100%; max-width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,.15); animation: popIn .18s ease; }
.pop-title { font-family: var(--font-title); font-size: .95rem; font-weight: 700; margin-bottom: 6px; color: var(--text-dark); }
.pop-sub { font-size: .8rem; color: var(--text-mid); margin-bottom: 16px; line-height: 1.5; }
.pop-sub em { color: var(--text-dark); font-style: normal; font-weight: 700; }
.pop-libs { display: flex; flex-direction: column; gap: 7px; max-height: 240px; overflow-y: auto; margin-bottom: 16px; }
.pop-lib-opt { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg-light); border: 1.5px solid var(--border); border-radius: var(--r); cursor: pointer; transition: all .15s; user-select: none; }
.pop-lib-opt:hover { border-color: var(--primary); background: var(--primary-lt); }
.pop-lib-opt.selected { border-color: var(--primary); background: var(--primary-lt); }
.odot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.oname { flex: 1; font-family: var(--font-title); font-size: .85rem; font-weight: 600; }
.ocheck { font-size: .9rem; color: var(--primary); width: 16px; text-align: center; font-weight: 700; }
.pop-actions { display: flex; gap: 10px; }
.btn-pop-cancel { flex: 1; background: none; border: 1.5px solid var(--border); border-radius: var(--r-pill); padding: 9px; color: var(--text-mid); font-family: var(--font-title); font-size: .84rem; font-weight: 600; transition: all var(--trans); }
.btn-pop-cancel:hover { border-color: var(--text-dark); color: var(--text-dark); }
.btn-pop-ok { flex: 1; background: var(--primary); border: none; border-radius: var(--r-pill); padding: 9px; color: var(--white); font-family: var(--font-title); font-size: .84rem; font-weight: 700; transition: background var(--trans); }
.btn-pop-ok:hover { background: var(--primary-dk); }

/* ── TOAST ── */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--text-dark); border-radius: var(--r-pill);
  padding: 11px 24px; font-family: var(--font-title); font-size: .84rem; font-weight: 600; color: var(--white);
  z-index: 9999; opacity: 0; transition: opacity .3s; pointer-events: none;
  box-shadow: 0 4px 20px rgba(0,0,0,.25); white-space: nowrap;
}
#toast.show { opacity: 1; }

/* ── FOOTER ── */
#footer {
  background: var(--bg-dark); color: rgba(255,255,255,.7);
  padding: 32px 28px 20px; margin-top: auto;
}
.footer-inner { max-width: var(--max-w); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
.footer-logo img { height: 32px; filter: brightness(0) invert(1); opacity: .85; }
.footer-links { display: flex; gap: 6px; flex-wrap: wrap; }
.footer-links a { font-size: .78rem; color: rgba(255,255,255,.6); padding: 4px 8px; border-radius: var(--r-sm); transition: color var(--trans); }
.footer-links a:hover { color: var(--white); text-decoration: none; }
.footer-bottom { border-top: 1px solid rgba(255,255,255,.1); padding-top: 16px; display: flex; align-items: center; justify-content: center; }
.footer-copy { font-size: .75rem; color: rgba(255,255,255,.4); font-family: var(--font-title); }

/* ── BOUTONS ACTIONS RÉUTILISABLES ── */
.btn-action { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: var(--r-pill); padding: 7px 16px; font-family: var(--font-title); font-size: .8rem; font-weight: 600; border: 1.5px solid; cursor: pointer; transition: all .2s; white-space: nowrap; }
.btn-action.green  { background: rgba(46,158,91,.08);  border-color: rgba(46,158,91,.3);   color: var(--success); }
.btn-action.green:hover  { background: rgba(46,158,91,.18); }
.btn-action.blue   { background: var(--primary-lt);    border-color: rgba(27,107,138,.25); color: var(--primary); }
.btn-action.blue:hover   { background: var(--primary); color: var(--white); border-color: var(--primary); }
.btn-action.red    { background: rgba(217,64,64,.06);  border-color: rgba(217,64,64,.22);  color: var(--danger); }
.btn-action.red:hover    { background: rgba(217,64,64,.14); }

/* ── RESPONSIVE ── */
@media (max-width: 1024px) {
  #sidebar { width: 240px; }
  .products-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
}
@media (max-width: 768px) {
  #sidebar { display: none; }
  .header-stats { display: none; }
  #topbar { padding: 8px 14px; }
  #content { padding: 14px; }
  .modal-box, .calc-box { border-radius: var(--r); }
  .modal-stats { grid-template-columns: 1fr 1fr; }
  .nav-tab span:first-child { font-size: 0; width: 0; overflow: hidden; }
}
@media (max-width: 480px) {
  #header { padding: 0 14px; }
  .modal-overlay { padding: 10px; }
  .modal-stats { grid-template-columns: 1fr 1fr; }
}


/* ── SYSTÈME PANNEAUX CÔTE À CÔTE ── */
#panels-area { display:none; flex:1; min-width:0; overflow:hidden; height:calc(100vh - 130px); }
#panels-area.visible { display:flex; }
.panel { display:none; flex-direction:column; background:#fff; border-right:1px solid var(--border); overflow:hidden; min-width:0; }
.panel.open { display:flex; flex:1; }
.panel + .panel.open { border-left:2px solid var(--primary); }
.panel-head { display:flex; align-items:center; gap:10px; padding:12px 16px 10px; border-bottom:1px solid var(--border); background:#fff; flex-shrink:0; flex-wrap:wrap; }
.panel-head h2 { font-family:var(--font-title); font-size:.9rem; font-weight:700; color:var(--text-dark); flex:1; min-width:0; }
.panel-close { background:none; border:1.5px solid var(--border); border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center; color:var(--text-light); font-size:.8rem; cursor:pointer; flex-shrink:0; transition:all .15s; }
.panel-close:hover { border-color:var(--danger); color:var(--danger); }
.panel-body { flex:1; overflow-y:auto; padding:14px 18px; }

</style>
</head>
