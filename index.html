<script>/**
 * search.js — Fonctions de recherche transversales
 */
const Search = {
  normCode(c) { return String(c || '').replace(/^0+/, ''); },

  products(query, list) {
    if (!query) return list;
    const q = query.toLowerCase().trim();
    return list.filter(p =>
      (p.designation || '').toLowerCase().includes(q) ||
      this.normCode(p.articleCode).includes(q) ||
      (p.articleCode || '').toLowerCase().includes(q) ||
      (p.supplierArticleNumber || '').toLowerCase().includes(q) ||
      (p.supplierName || '').toLowerCase().includes(q)
    );
  },

  codes(query, categories) {
    if (!query) return categories;
    const q = query.toLowerCase().trim();
    return categories
      .map(cat => ({ ...cat, produits: cat.produits.filter(p =>
        (p.composants || '').toLowerCase().includes(q) ||
        this.normCode(p.codeArticle).includes(q)
      )}))
      .filter(cat => cat.produits.length > 0);
  },

  recipes(query, list) {
    if (!query) return list;
    const q = query.toLowerCase().trim();
    return list.filter(r =>
      (r.productName || '').toLowerCase().includes(q) ||
      r.ingredients.some(ing =>
        (ing.articleName || '').toLowerCase().includes(q) ||
        this.normCode(ing.articleCode).includes(q)
      )
    );
  },

  assortiment(query, list) {
    if (!query) return list;
    const q = query.toLowerCase().trim();
    return list.filter(p => (p.libelle || '').toLowerCase().includes(q));
  }
};
</script>
<script>/**
 * calculateur.js — Calculateur de portions et export PDF
 */
const Calculateur = {
  selected: {},  // { key: { recipe, qty } }

  toggle(key, recipe) {
    if (this.selected[key]) delete this.selected[key];
    else this.selected[key] = { recipe, qty: 1 };
    this.updateBtn();
    return !!this.selected[key];
  },

  setQty(key, qty) {
    if (this.selected[key]) this.selected[key].qty = Math.max(1, parseInt(qty) || 1);
  },

  count() { return Object.keys(this.selected).length; },

  updateBtn() {
    const n = this.count();
    const btn = document.getElementById('btn-calc');
    if (btn) btn.style.display = n > 0 ? 'inline-flex' : 'none';
    const countSpan = document.getElementById('calc-count');
    if (countSpan) countSpan.textContent = n;
  },

  computeNeeds() {
    const map = {};
    Object.values(this.selected).forEach(({ recipe, qty }) => {
      recipe.ingredients.forEach(ing => {
        const code = Search.normCode(ing.articleCode);
        const k = `${code}__${ing.articleName}`;
        if (!map[k]) map[k] = { code, name: ing.articleName, unit: ing.unit, storage: ing.storageCondition, totalG: 0, totalQty: 0 };
        map[k].totalG   += Math.round((ing.weightGrams || 0) * qty);
        map[k].totalQty += (ing.quantity || 0) * qty;
      });
    });
    return Object.values(map).sort((a, b) => a.name.localeCompare(b.name));
  },

  exportPDF(ingredients) {
    const recipeLines = Object.values(this.selected)
      .map(({ recipe, qty }) => `• ${recipe.productName} × ${qty} portion${qty > 1 ? 's' : ''}`)
      .join('\n');

    const rows = ingredients.map(ing => `
      <tr>
        <td>${ing.code}</td>
        <td>${ing.name}</td>
        <td>${ing.storage || '—'}</td>
        <td style="text-align:right;font-weight:700;color:#1B6B8A">${ing.totalG} g</td>
        <td style="text-align:right">${Math.round(ing.totalQty * 100) / 100}${ing.unit && ing.unit !== 'other' ? ' ' + ing.unit : ''}</td>
      </tr>`).join('');

    const win = window.open('', '_blank');
    if (!win) return;
    win.document.write(`<!DOCTYPE html><html lang="fr"><head>
      <meta charset="UTF-8">
      <title>Liste de commande — ${new Date().toLocaleDateString('fr-FR')}</title>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap');
        body{font-family:'Open Sans',sans-serif;margin:32px;color:#1A1A1A;background:#fff;}
        h1{font-family:'Montserrat',sans-serif;font-size:1.3rem;font-weight:800;color:#1B6B8A;margin-bottom:4px;}
        .meta{font-size:.82rem;color:#666;white-space:pre-line;background:#F7F8FA;padding:12px 16px;border-radius:8px;margin-bottom:22px;border:1px solid #E0E0E0;}
        table{width:100%;border-collapse:collapse;}
        th{background:#1B6B8A;color:#fff;font-family:'Montserrat',sans-serif;font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;padding:9px 12px;text-align:left;}
        td{padding:8px 12px;border-bottom:1px solid #eee;font-size:.83rem;}
        tr:nth-child(even) td{background:#F7F8FA;}
        .btn{display:inline-block;margin-top:18px;padding:10px 22px;background:#1B6B8A;color:#fff;border:none;border-radius:25px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:.85rem;cursor:pointer;}
        @media print{.btn{display:none;}}
      </style></head><body>
      <h1>🧮 Liste de commande</h1>
      <div class="meta">Recettes :\n${recipeLines}\n\nDate : ${new Date().toLocaleDateString('fr-FR', {weekday:'long',year:'numeric',month:'long',day:'numeric'})}</div>
      <table><thead><tr><th>Code article</th><th>Ingrédient</th><th>Conservation</th><th style="text-align:right">Poids total</th><th style="text-align:right">Qté totale</th></tr></thead><tbody>${rows}</tbody></table>
      <button class="btn" onclick="window.print()">🖨️ Imprimer / Exporter PDF</button>
    </body></html>`);
    win.document.close();
  }
};
</script>
<script>/**
 * main.js — Orchestration principale · Catalogue Fournisseurs Elior
 */

/* ══════════════════════════════════════════════
   ÉTAT GLOBAL
══════════════════════════════════════════════ */
const App = {
  products:    [],
  suppliers:   [],
  codesData:   [],
  assortData:  {},
  recipesData: {},

  currentSupplier: 'all',
  currentPage:  1,
  PER_PAGE:     30,
  filteredProducts: [],
  sortMode:     'n',
  activeDrawer: null,

  popupCode:  null,
  popupSnap:  {},
  COLORS: ['#1B6B8A','#2E9E5B','#E8A020','#D94040','#8B5CF6','#FB923C','#06B6D4','#EC4899','#6366F1','#F59E0B'],
  selectedColor: '#1B6B8A',

  asstCurCat:'all', asstCurProt:'all', asstCurGamme:'all', asstQuery:'',
  codesCurCat:'all', codesQuery:'',
  recCurCat:'all', recQuery:'',

  /* ── Réception données depuis Loader ── */
  addSupplierData(data) {
    if (!data || !Array.isArray(data.products)) return;
    const supName = data.supplierName;
    data.products.forEach(p => {
      if (!p.supplierName && supName) p.supplierName = supName;
      this.products.push(p);
    });
  },
  onSuppliersDone() {
    this.suppliers = [...new Set(this.products.map(p => p.supplierName))].sort();
  },
  addCodesData(data) {
    if (Array.isArray(data)) data.forEach(c => this.codesData.push(c));
  },
  addAssortimentData(data) {
    if (data.categorie && data.produits) this.assortData[data.categorie] = data.produits;
  },
  addRecipesData(data) {
    if (data.category && data.products) this.recipesData[data.category] = data.products;
  },

  /* ── Initialisation ── */
  init() {
    this.hideLoading();
    this.buildSidebar();
    this.buildCodesTabs();
    this.buildAsstTabs();
    this.buildRecipesTabs();
    Libs.init();
    this.buildColorPicker();
    this.initEvents();
    this.applyFilters();
    document.getElementById('stat-products').textContent = this.products.length.toLocaleString('fr');
    document.getElementById('stat-suppliers').textContent = this.suppliers.length;
    document.getElementById('stat-libs').textContent = Libs.all.length;
    Calculateur.updateBtn();
  },

  /* ── Utilitaires ── */
  esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  },
  normCode(c) { return String(c || '').replace(/^0+/, ''); },
  libsOf(code) { return Libs.all.filter(l => l.products.some(e => (e.code || e) === code)); },

  showLoading(text, pct) {
    const bar = document.getElementById('loading-bar');
    const txt = document.getElementById('loading-text');
    if (bar) bar.style.width = (pct || 0) + '%';
    if (txt) txt.textContent = text || 'Chargement…';
  },
  hideLoading() {
    const ls = document.getElementById('loading-screen');
    if (!ls) return;
    ls.classList.add('hidden');
    setTimeout(() => ls.remove(), 500);
  },
  showFileError(folder, filename, msg) {
    const banner = document.getElementById('error-banner');
    if (!banner) return;
    const item = document.createElement('div');
    item.className = 'error-item';
    item.innerHTML = `<span>⚠️</span><span><b>${folder}/${filename}</b><br>${msg}</span>`;
    banner.appendChild(item);
    setTimeout(() => item.remove(), 8000);
  },
  toast(msg, color) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.style.background = color || 'var(--text-dark)';
    t.classList.add('show');
    clearTimeout(this._tt);
    this._tt = setTimeout(() => t.classList.remove('show'), 2600);
  },

  /* ══════════════════════════════════════════════
     SIDEBAR
  ══════════════════════════════════════════════ */
  buildSidebar() {
    const counts = {};
    this.products.forEach(p => { counts[p.supplierName] = (counts[p.supplierName] || 0) + 1; });

    let html = `<div class="sidebar-item active" data-sup="all">
      <span class="sup-name">Tous les fournisseurs</span>
      <span class="sidebar-count">${this.products.length}</span>
    </div>`;
    this.suppliers.forEach(name => {
      html += `<div class="sidebar-item" data-sup="${this.esc(name)}">
        <span class="sup-name">${this.esc(name)}</span>
        <span class="sidebar-count">${counts[name] || 0}</span>
      </div>`;
    });

    const sl = document.getElementById('sidebar-list');
    sl.innerHTML = html;
    sl.addEventListener('click', e => {
      const el = e.target.closest('.sidebar-item');
      if (!el) return;
      this.currentSupplier = el.dataset.sup;
      sl.querySelectorAll('.sidebar-item').forEach(x => x.classList.toggle('active', x === el));
      this.currentPage = 1;
      this.applyFilters();
    });
  },

  /* ══════════════════════════════════════════════
     CATALOGUE
  ══════════════════════════════════════════════ */
  applyFilters() {
    const q = document.getElementById('search-input').value;
    const clr = document.getElementById('btn-clear');
    if (clr) clr.style.display = q ? 'block' : 'none';

    let list = this.currentSupplier === 'all' ? this.products : this.products.filter(p => p.supplierName === this.currentSupplier);
    list = Search.products(q, list);
    list = this.sortProducts(list);
    this.filteredProducts = list;
    this.currentPage = 1;
    this.renderGrid();
  },

  sortProducts(list) {
    const s = this.sortMode;
    return [...list].sort((a, b) => {
      if (s === 'pa') return (a.unitPrice || 0) - (b.unitPrice || 0);
      if (s === 'pd') return (b.unitPrice || 0) - (a.unitPrice || 0);
      if (s === 'c')  return (a.articleCode || '').localeCompare(b.articleCode || '');
      if (s === 'nd') return (b.designation || '').localeCompare(a.designation || '');
      return (a.designation || '').localeCompare(b.designation || '');
    });
  },

  renderGrid() {
    const start = (this.currentPage - 1) * this.PER_PAGE;
    const data  = this.filteredProducts.slice(start, start + this.PER_PAGE);
    const sup   = this.currentSupplier !== 'all' ? ` — ${this.esc(this.currentSupplier)}` : '';
    document.getElementById('results-info').innerHTML =
      `<em>${this.filteredProducts.length.toLocaleString('fr')}</em> produit(s)${sup}`;

    const grid = document.getElementById('products-grid');
    if (!data.length) {
      grid.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><h3>Aucun résultat</h3></div>`;
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    grid.innerHTML = data.map(p => {
      const ml = this.libsOf(p.articleCode);
      const hf = ml.length > 0;
      const code = this.esc(p.articleCode);
      const price = p.unitPrice != null
        ? `<div class="card-price">${p.unitPrice.toFixed(3)} €<span class="unit"> / ${this.esc(p.unitOfInvoice)}</span></div>`
        : `<div class="no-price">Prix N/C</div>`;
      const tags = ml.map(l =>
        `<span class="lib-tag" style="background:${l.color}18;color:${l.color};border:1px solid ${l.color}40">${this.esc(l.name)}</span>`
      ).join('');
      return `<div class="product-card">
        <div class="card-header">
          <div class="supplier-badge">${this.esc(p.supplierName)}</div>
          <button class="fav-btn ${hf ? 'active' : ''}" data-code="${code}">${hf ? '⭐' : '☆'}</button>
        </div>
        <div class="card-name">${this.esc(p.designation || '—')}</div>
        <div class="card-meta">
          <div><div class="meta-label">Code art.</div><div class="meta-value">${this.esc(p.articleCode || '—')}</div></div>
          <div><div class="meta-label">Réf. fourn.</div><div class="meta-value">${this.esc(p.supplierArticleNumber || '—')}</div></div>
          <div><div class="meta-label">U. vente</div><div class="meta-value">${this.esc(p.unitOfSale || '—')}</div></div>
          <div><div class="meta-label">U. fact.</div><div class="meta-value">${this.esc(p.unitOfInvoice || '—')}</div></div>
        </div>
        ${tags ? `<div class="lib-tags">${tags}</div>` : ''}
        ${price}
      </div>`;
    }).join('');
    this.renderPagination();
  },

  renderPagination() {
    const tot = Math.ceil(this.filteredProducts.length / this.PER_PAGE);
    const pag = document.getElementById('pagination');
    if (tot <= 1) { pag.innerHTML = ''; return; }
    let html = '';
    if (this.currentPage > 1) html += `<button class="page-btn" data-p="${this.currentPage - 1}">← Préc.</button>`;
    for (let i = 1; i <= tot; i++) {
      if (i === 1 || i === tot || Math.abs(i - this.currentPage) <= 2)
        html += `<button class="page-btn ${i === this.currentPage ? 'active' : ''}" data-p="${i}">${i}</button>`;
      else if (Math.abs(i - this.currentPage) === 3)
        html += `<span class="page-dots">…</span>`;
    }
    if (this.currentPage < tot) html += `<button class="page-btn" data-p="${this.currentPage + 1}">Suiv. →</button>`;
    pag.innerHTML = html;
  },

  goPage(n) { this.currentPage = n; this.renderGrid(); window.scrollTo({ top: 130, behavior: 'smooth' }); },

  /* ══════════════════════════════════════════════
     DRAWERS
  ══════════════════════════════════════════════ */
  // IDs des panneaux dans l'ordre d'ouverture
  _openPanels: [],
  _panelMap: {
    'btn-codes':   'panel-codes',
    'btn-asst':    'panel-asst',
    'btn-recipes': 'panel-recipes',
    'btn-libs':    'panel-libs'
  },

  closeAllDrawers() {
    this._openPanels = [];
    ['panel-codes','panel-asst','panel-recipes','panel-libs'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.classList.remove('open');
    });
    document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
    this._updatePanelLayout();
    this.activeDrawer = null;
  },

  _updatePanelLayout() {
    const area    = document.getElementById('panels-area');
    const content = document.getElementById('content');
    const n = this._openPanels.length;
    if (n === 0) {
      area.classList.remove('visible');
      content.style.display = '';
    } else {
      area.classList.add('visible');
      content.style.display = 'none';
    }
  },

  togglePanel(btnId, onOpen) {
    const panelId = this._panelMap[btnId];
    if (!panelId) return;
    const panel = document.getElementById(panelId);
    const btn   = document.getElementById(btnId);
    const isOpen = panel.classList.contains('open');

    if (isOpen) {
      // Fermer ce panel
      panel.classList.remove('open');
      if (btn) btn.classList.remove('active');
      this._openPanels = this._openPanels.filter(id => id !== panelId);
    } else {
      // Ouvrir — max 2 panneaux simultanés
      if (this._openPanels.length >= 2) {
        // Fermer le plus ancien
        const oldest = this._openPanels.shift();
        const oldPanel = document.getElementById(oldest);
        if (oldPanel) oldPanel.classList.remove('open');
        // Désactiver son bouton
        Object.entries(this._panelMap).forEach(([bid, pid]) => {
          if (pid === oldest) {
            const ob = document.getElementById(bid);
            if (ob) ob.classList.remove('active');
          }
        });
      }
      panel.classList.add('open');
      if (btn) btn.classList.add('active');
      this._openPanels.push(panelId);
      this.activeDrawer = panelId;
      if (onOpen) onOpen();
    }
    this._updatePanelLayout();
  },

  closePanel(panelId) {
    const panel = document.getElementById(panelId);
    if (panel) panel.classList.remove('open');
    this._openPanels = this._openPanels.filter(id => id !== panelId);
    // Désactiver le bouton correspondant
    Object.entries(this._panelMap).forEach(([bid, pid]) => {
      if (pid === panelId) {
        const b = document.getElementById(bid);
        if (b) b.classList.remove('active');
      }
    });
    this._updatePanelLayout();
  },

  closeModal(id) { document.getElementById(id).classList.remove('open'); },
  openModal(id)  { document.getElementById(id).classList.add('open'); },

  /* ══════════════════════════════════════════════
     CODES ARTICLES
  ══════════════════════════════════════════════ */
  buildCodesTabs() {
    const cats = ['all', ...this.codesData.map(c => c.categorie)];
    document.getElementById('codes-tabs').innerHTML = cats.map(c =>
      `<div class="ftab ${c==='all'?'active':''}" data-cat="${this.esc(c)}">${c==='all'?'Tout':this.esc(c)}</div>`
    ).join('');
  },

  renderCodesGrid() {
    const filtered = Search.codes(this.codesQuery, this.codesData)
      .filter(cat => this.codesCurCat === 'all' || cat.categorie === this.codesCurCat);
    const allP = filtered.flatMap(cat => cat.produits);
    if (!allP.length) {
      document.getElementById('codes-grid').innerHTML =
        '<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🔍</div><h3>Aucun résultat</h3></div>';
      return;
    }
    document.getElementById('codes-grid').innerHTML = allP.map(p => {
      const code = this.esc(this.normCode(p.codeArticle));
      const hf   = this.libsOf(this.normCode(p.codeArticle)).length > 0;
      const fourn = [p.fournisseur1, p.fournisseur2].filter(Boolean).join(' · ');
      return `<div class="code-card" data-code="${code}">
        <div class="code-info">
          <div class="code-name">${this.esc(p.composants)}</div>
          <div class="code-ref">${code}</div>
          <div class="code-fourn">${this.esc(fourn)}</div>
        </div>
        <button class="code-fav ${hf?'active':''}" data-code="${code}">${hf?'⭐':'☆'}</button>
      </div>`;
    }).join('');
  },

  /* ══════════════════════════════════════════════
     ASSORTIMENT
  ══════════════════════════════════════════════ */
  buildAsstTabs() {
    const cats = ['all', ...Object.keys(this.assortData)];
    document.getElementById('asst-tabs-cat').innerHTML = cats.map(c =>
      `<div class="ftab ${c==='all'?'active':''}" data-cat="${this.esc(c)}">${c==='all'?'Toutes catégories':this.esc(c)}</div>`
    ).join('');
    const prots  = ['all','Volaille','Végétarien','Poisson','Porc/Bœuf'];
    const gammes = ['all','Permanente','Saisonnière'];
    document.getElementById('asst-tabs-prot').innerHTML =
      '<span class="ftab-sep">Protéine :</span>' +
      prots.map(p => `<div class="ftab ${p==='all'?'active':''}" data-prot="${p}">${p==='all'?'Toutes':this.esc(p)}</div>`).join('') +
      '<span class="ftab-sep">Gamme :</span>' +
      gammes.map(g => `<div class="ftab ${g==='all'?'active':''}" data-gamme="${g}">${g==='all'?'Toutes':this.esc(g)}</div>`).join('');
  },

  ratioColor(r) { return r <= 30 ? 'var(--success)' : r <= 40 ? 'var(--warning)' : 'var(--danger)'; },
  protClass(p) {
    if (!p) return '';
    if (p.includes('Volaille')) return 'vol';
    if (p.includes('gétarien') || p.includes('getarien')) return 'veg';
    if (p.includes('Poisson')) return 'poi';
    return 'por';
  },

  renderAsstGrid() {
    const rows = [];
    Object.entries(this.assortData).forEach(([catKey, items]) => {
      if (this.asstCurCat !== 'all' && catKey !== this.asstCurCat) return;
      Search.assortiment(this.asstQuery, items).forEach(item => {
        if (this.asstCurProt !== 'all' && item.categorieProteine !== this.asstCurProt) return;
        if (this.asstCurGamme === 'Permanente' && item.gamme !== 'Permanente') return;
        if (this.asstCurGamme === 'Saisonnière' && item.gamme !== 'Saisonnière') return;
        rows.push({ catKey, item });
      });
    });
    if (!rows.length) {
      document.getElementById('asst-grid').innerHTML =
        '<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🔍</div><h3>Aucun résultat</h3></div>';
      return;
    }
    document.getElementById('asst-grid').innerHTML = rows.map(({ catKey, item }) => {
      const ratio = item.ratioMP || 0;
      const col   = this.ratioColor(ratio);
      const gc    = item.gamme === 'Permanente' ? 'perm' : 'sais';
      const gl    = item.gamme === 'Permanente' ? 'Perm.' : 'Saison.';
      const pc    = this.protClass(item.categorieProteine || '');
      const cl    = item.cat || catKey.replace(/_/g, ' ');
      return `<div class="asst-card">
        <div class="asst-top">
          <div class="asst-name">${this.esc(item.libelle || '—')}</div>
          <span class="badge-gamme ${gc}">${gl}</span>
        </div>
        <div class="asst-sub">
          <span class="badge-cat">${this.esc(cl)}</span>
          ${item.categorieProteine ? `<span class="badge-prot ${pc}">${this.esc(item.categorieProteine)}</span>` : ''}
        </div>
        <hr class="asst-divider"/>
        <div class="asst-prices">
          <div class="aprice"><div class="aprice-lbl">Public</div><div class="aprice-val">${item.prixPublicTTC != null ? item.prixPublicTTC.toFixed(2) + ' €' : '—'}</div></div>
          <div class="aprice"><div class="aprice-lbl">Hospi</div><div class="aprice-val">${item.prixHospiTTC  != null ? item.prixHospiTTC.toFixed(2)  + ' €' : '—'}</div></div>
          <div class="aprice"><div class="aprice-lbl">CC</div><div class="aprice-val">${item.prixCCTTC    != null ? item.prixCCTTC.toFixed(2)    + ' €' : '—'}</div></div>
        </div>
        <div class="ratio-row">
          <span class="ratio-lbl">Ratio MP</span>
          <div class="ratio-bar"><div class="ratio-fill" style="width:${Math.min(100, ratio*100/60)}%;background:${col}"></div></div>
          <span class="ratio-val" style="color:${col}">${ratio}%</span>
        </div>
        <div class="acout">Coût MP : ${item.coutMP != null ? item.coutMP.toFixed(2) + ' €' : '—'}</div>
      </div>`;
    }).join('');
  },

  /* ══════════════════════════════════════════════
     FICHES RECETTES
  ══════════════════════════════════════════════ */
  buildRecipesTabs() {
    const cats  = ['all', ...Object.keys(this.recipesData)];
    const total = Object.values(this.recipesData).reduce((a, v) => a + v.length, 0);
    document.getElementById('recipes-tabs').innerHTML = cats.map(c => {
      const n = c === 'all' ? total : (this.recipesData[c] || []).length;
      return `<div class="ftab ${c==='all'?'active':''}" data-cat="${this.esc(c)}">${c==='all'?'Toutes':this.esc(c)} (${n})</div>`;
    }).join('');
  },

  allRecipes() {
    const all = [];
    Object.entries(this.recipesData).forEach(([cat, prods]) =>
      prods.forEach(r => all.push({ ...r, _cat: cat })));
    return all;
  },
  getRecipeByKey(key) { return this.allRecipes().find(r => r.productNumber + r._cat === key); },

  renderRecipesGrid() {
    const filtered = Search.recipes(this.recQuery, this.allRecipes())
      .filter(r => this.recCurCat === 'all' || r._cat === this.recCurCat);
    if (!filtered.length) {
      document.getElementById('recipes-grid').innerHTML =
        '<div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--text-light)">Aucune recette trouvée</div>';
      return;
    }
    document.getElementById('recipes-grid').innerHTML = filtered.map(r => {
      const key = this.esc(r.productNumber + r._cat);
      const preview = r.ingredients.slice(0, 3).map(i => this.esc(i.articleName)).join(', ')
        + (r.ingredients.length > 3 ? ' …' : '');
      const sel = !!Calculateur.selected[r.productNumber + r._cat];
      return `<div class="recipe-card ${sel ? 'selected' : ''}" data-key="${key}">
        <div class="recipe-card-top">
          <span class="recipe-cat">${this.esc(r._cat)}</span>
          <span class="recipe-portions">${r.portionCount} portion(s)</span>
        </div>
        <div class="recipe-name">${this.esc(r.productName)}</div>
        <div class="recipe-preview">${preview}</div>
        <div class="recipe-actions">
          <button class="btn-fiche" data-key="${key}">📄 Voir la fiche</button>
          <button class="btn-select ${sel ? 'active' : ''}" data-key="${key}">${sel ? '✓ Sélectionné' : '+ Sélectionner'}</button>
        </div>
      </div>`;
    }).join('');
  },

  openFiche(key) {
    const r = this.getRecipeByKey(key);
    if (!r) return;

    const storageBadge = s => {
      if (!s || s === 'other') return '—';
      const cls = s === 'Surgelé' ? 'surgele' : s === 'Frais' ? 'frais' : 'ambiant';
      return `<span class="badge-storage ${cls}">${this.esc(s)}</span>`;
    };

    const totalW = r.ingredients.reduce((a, i) => a + (i.weightGrams || 0), 0);
    const ingRows = r.ingredients.map(ing => {
      const code = this.normCode(ing.articleCode);
      return `<tr>
        <td><span class="ingr-code">${this.esc(code)}</span></td>
        <td><span class="ingr-name">${this.esc(ing.articleName)}</span></td>
        <td>${storageBadge(ing.storageCondition)}</td>
        <td class="ingr-weight">${ing.weightGrams}g</td>
        <td style="font-size:.78rem;color:var(--text-mid)">${ing.quantity} ${this.esc(ing.unit === 'other' ? '' : ing.unit)}</td>
        <td><button class="btn-catalogue" data-code="${this.esc(code)}">🔍 Catalogue</button></td>
      </tr>`;
    }).join('');

    const steps = r.instructions
      ? r.instructions.map((s, i) => `<li><span class="step-num">${i + 1}</span>${this.esc(s)}</li>`).join('')
      : '';

    document.getElementById('fiche-content').innerHTML = `
      <div class="modal-head">
        <div class="modal-head-info">
          <div class="modal-title">${this.esc(r.productName)}</div>
          <div class="modal-badges">
            <span class="modal-badge" style="background:rgba(255,255,255,.2);color:#fff">${this.esc(r._cat)}</span>
            ${r.productNumber ? `<span class="modal-badge" style="background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);font-family:'Courier New',monospace">${this.esc(r.productNumber)}</span>` : ''}
          </div>
        </div>
        <button class="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-stats">
          <div class="mstat"><div class="mstat-lbl">Portions</div><div class="mstat-val">${r.portionCount}</div></div>
          <div class="mstat"><div class="mstat-lbl">Ingrédients</div><div class="mstat-val">${r.ingredients.length}</div></div>
          <div class="mstat"><div class="mstat-lbl">Poids/portion</div><div class="mstat-val">${r.netWeightPerPortion || Math.round(totalW / r.portionCount)}g</div></div>
          <div class="mstat"><div class="mstat-lbl">Poids total</div><div class="mstat-val">${totalW}g</div></div>
        </div>
        <div class="section-title">Ingrédients</div>
        <table class="ingr-table">
          <thead><tr><th>Code</th><th>Ingrédient</th><th>Conservation</th><th>Poids</th><th>Qté</th><th>Catalogue</th></tr></thead>
          <tbody>${ingRows}</tbody>
        </table>
        ${steps ? `<div class="section-title">Instructions</div><ul class="steps-list">${steps}</ul>` : ''}
      </div>`;
    this.openModal('modal-fiche');
  },

  /* ══════════════════════════════════════════════
     CALCULATEUR
  ══════════════════════════════════════════════ */
  openCalc() {
    const keys = Object.keys(Calculateur.selected);
    if (!keys.length) return;
    const rows = keys.map(key => {
      const { recipe, qty } = Calculateur.selected[key];
      return `<tr>
        <td style="font-size:.84rem;color:var(--text-dark);font-weight:600;font-family:var(--font-title)">${this.esc(recipe.productName)}</td>
        <td><span style="font-size:.72rem;color:var(--text-light)">${this.esc(recipe._cat)}</span></td>
        <td><input type="number" class="qty-input" data-key="${this.esc(key)}" min="1" value="${qty}"/></td>
        <td><button class="btn-rm" data-key="${this.esc(key)}">✕</button></td>
      </tr>`;
    }).join('');

    document.getElementById('calc-content').innerHTML = `
      <div class="calc-head">
        <h2>🧮 Calculateur de besoins</h2>
        <button class="modal-close">✕</button>
      </div>
      <div class="calc-body">
        <table class="calc-table">
          <thead><tr><th>Recette</th><th>Catégorie</th><th>Portions</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <button class="btn-compute" id="btn-compute">📋 Calculer les besoins</button>
        <div id="calc-result"></div>
      </div>`;
    this.openModal('modal-calc');
  },

  renderCalcResult() {
    const ingredients = Calculateur.computeNeeds();
    if (!ingredients.length) return;
    const storageBadge = s => {
      if (!s || s === 'other') return '—';
      const cls = s === 'Surgelé' ? 'surgele' : s === 'Frais' ? 'frais' : 'ambiant';
      return `<span class="badge-storage ${cls}">${this.esc(s)}</span>`;
    };
    const rows = ingredients.map(ing => `<tr>
      <td><span class="ingr-code">${this.esc(ing.code)}</span></td>
      <td style="font-size:.82rem;font-weight:600;font-family:var(--font-title);color:var(--text-dark)">${this.esc(ing.name)}</td>
      <td>${storageBadge(ing.storage)}</td>
      <td style="font-weight:700;color:var(--primary);text-align:right;font-family:var(--font-title)">${ing.totalG}g</td>
      <td style="text-align:right;color:var(--text-mid)">${Math.round(ing.totalQty * 100) / 100}${ing.unit && ing.unit !== 'other' ? ' ' + this.esc(ing.unit) : ''}</td>
    </tr>`).join('');

    document.getElementById('calc-result').innerHTML = `
      <div class="calc-result-header">
        <div class="calc-result-label">${ingredients.length} ingrédient(s) nécessaire(s)</div>
        <button class="btn-pdf" id="btn-pdf">⬇ Exporter PDF</button>
      </div>
      <table class="ingr-table">
        <thead><tr><th>Code</th><th>Ingrédient</th><th>Conservation</th><th style="text-align:right">Poids total</th><th style="text-align:right">Qté totale</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    document.getElementById('btn-pdf').addEventListener('click', () => Calculateur.exportPDF(ingredients));
  },

  /* ══════════════════════════════════════════════
     BIBLIOTHÈQUES
  ══════════════════════════════════════════════ */
  buildColorPicker() {
    const cp = document.getElementById('libs-color-pick');
    this.COLORS.forEach((c, i) => {
      const sw = document.createElement('div');
      sw.className = 'cswatch' + (i === 0 ? ' active' : '');
      sw.style.background = c;
      sw.addEventListener('click', () => {
        this.selectedColor = c;
        cp.querySelectorAll('.cswatch').forEach(x => {
          x.classList.toggle('active', x === sw);
          x.style.borderColor = x === sw ? '#333' : 'transparent';
        });
      });
      cp.appendChild(sw);
    });
  },

  renderLibsDrawer() {
    const el = document.getElementById('libs-list');
    if (!Libs.all.length) { el.innerHTML = '<div class="libs-empty">Créez une bibliothèque ci-dessus.</div>'; return; }
    el.innerHTML = Libs.all.map(lib => {
      const rows = lib.products.map(entry => {
        const code = entry.code || entry;
        const p = this.products.find(x => x.articleCode === code);
        if (!p) return '';
        const pr = p.unitPrice != null ? `${p.unitPrice.toFixed(3)} €/${this.esc(p.unitOfInvoice)}` : 'N/C';
        return `<div class="lib-prod-row" data-code="${this.esc(code)}">
          <div class="lib-bar" style="background:${lib.color}"></div>
          <div class="lib-prod-info">
            <div class="lib-prod-name">${this.esc(p.designation || code)}</div>
            <div class="lib-prod-meta">${this.esc(p.supplierName)} — ${this.esc(p.articleCode)}</div>
            <div class="lib-prod-price">${pr}</div>
          </div>
          <button class="lib-prod-rm" data-lib="${lib.id}" data-code="${this.esc(code)}">✕</button>
        </div>`;
      }).filter(Boolean).join('');
      return `<div class="lib-section">
        <div class="lib-section-head" data-lib-toggle="${lib.id}">
          <span class="lib-dot" style="background:${lib.color}"></span>
          <span class="lib-name">${this.esc(lib.name)}</span>
          <span class="lib-count">${lib.products.length}</span>
          <span class="lib-arrow" id="lib-arrow-${lib.id}">▶</span>
        </div>
        <div class="lib-body" id="lib-body-${lib.id}">${rows || '<div class="libs-empty">Aucun produit</div>'}</div>
      </div>`;
    }).join('');
  },

  /* ══════════════════════════════════════════════
     POPUP FAVORIS
  ══════════════════════════════════════════════ */
  openPopup(code) {
    this.popupCode = code;
    this.popupSnap = {};
    const p = this.products.find(x => x.articleCode === code);
    document.getElementById('pop-sub').innerHTML =
      `<em>${this.esc(p ? p.designation : code)}</em><br>Choisissez vos bibliothèques :`;
    Libs.all.forEach(l => { this.popupSnap[l.id] = l.products.some(e => (e.code || e) === code); });
    const el = document.getElementById('pop-libs');
    if (!Libs.all.length) {
      el.innerHTML = '<div style="font-size:.8rem;color:var(--text-light);text-align:center;padding:10px">Créez d\'abord une bibliothèque</div>';
    } else {
      el.innerHTML = Libs.all.map(l => {
        const sel = !!this.popupSnap[l.id];
        return `<div class="pop-lib-opt ${sel ? 'selected' : ''}" data-lid="${l.id}">
          <span class="odot" style="background:${l.color}"></span>
          <span class="oname">${this.esc(l.name)}</span>
          <span class="ocheck">${sel ? '✓' : ''}</span>
        </div>`;
      }).join('');
      el.querySelectorAll('.pop-lib-opt').forEach(opt => {
        opt.addEventListener('click', () => {
          this.popupSnap[opt.dataset.lid] = !this.popupSnap[opt.dataset.lid];
          opt.classList.toggle('selected', this.popupSnap[opt.dataset.lid]);
          opt.querySelector('.ocheck').textContent = this.popupSnap[opt.dataset.lid] ? '✓' : '';
        });
      });
    }
    this.openModal('popup-fav');
  },

  confirmPopup() {
    const code = this.popupCode;
    Libs.all.forEach(l => {
      const was  = l.products.some(e => (e.code || e) === code);
      const want = !!this.popupSnap[l.id];
      if (want && !was)  l.products.push({ code });
      if (!want && was) { const i = l.products.findIndex(e => (e.code || e) === code); if (i >= 0) l.products.splice(i, 1); }
    });
    Libs.save();
    this.renderGrid();
    if (this.activeDrawer === 'panel-codes')   this.renderCodesGrid();
    if (this.activeDrawer === 'panel-libs')    this.renderLibsDrawer();
    if (this.activeDrawer === 'panel-recipes') this.renderRecipesGrid();
    document.getElementById('stat-libs').textContent = Libs.all.length;
    this.closeModal('popup-fav');
    this.toast('Favoris mis à jour !', 'var(--primary)');
  },

  /* ══════════════════════════════════════════════
     ÉVÉNEMENTS
  ══════════════════════════════════════════════ */
  initEvents() {
    // Recherche
    const qi = document.getElementById('search-input');
    qi.addEventListener('input', () => this.applyFilters());
    document.getElementById('btn-clear').addEventListener('click', () => { qi.value = ''; this.applyFilters(); qi.focus(); });
    document.getElementById('sort-select').addEventListener('change', e => { this.sortMode = e.target.value; this.applyFilters(); });

    // Pagination
    document.getElementById('pagination').addEventListener('click', e => {
      const btn = e.target.closest('.page-btn');
      if (btn) this.goPage(parseInt(btn.dataset.p));
    });

    // Favoris dans grille
    document.getElementById('products-grid').addEventListener('click', e => {
      const fb = e.target.closest('.fav-btn');
      if (fb) this.openPopup(fb.dataset.code);
    });

    // Popup
    document.getElementById('btn-pop-cancel').addEventListener('click', () => this.closeModal('popup-fav'));
    document.getElementById('btn-pop-ok').addEventListener('click', () => this.confirmPopup());
    document.getElementById('popup-fav').addEventListener('click', e => { if (e.target === e.currentTarget) this.closeModal('popup-fav'); });

    // Drawers
    document.getElementById('btn-codes').addEventListener('click', () =>
      this.togglePanel('btn-codes', () => {
        if (!document.getElementById('codes-tabs').innerHTML) this.buildCodesTabs();
        this.renderCodesGrid();
      }));
    document.getElementById('btn-asst').addEventListener('click', () =>
      this.togglePanel('btn-asst', () => {
        if (!document.getElementById('asst-tabs-cat').innerHTML) this.buildAsstTabs();
        this.renderAsstGrid();
      }));
    document.getElementById('btn-recipes').addEventListener('click', () =>
      this.togglePanel('btn-recipes', () => {
        if (!document.getElementById('recipes-tabs').innerHTML) this.buildRecipesTabs();
        this.renderRecipesGrid();
      }));
    document.getElementById('btn-libs').addEventListener('click', () =>
      this.togglePanel('btn-libs', () => this.renderLibsDrawer()));

    // Boutons fermeture (✕) sur chaque panel
    document.querySelectorAll('.panel-close').forEach(btn => {
      btn.addEventListener('click', () => this.closePanel(btn.dataset.panel));
    });
    document.getElementById('btn-calc').addEventListener('click', () => this.openCalc());

    // Codes articles
    document.getElementById('codes-tabs').addEventListener('click', e => {
      const el = e.target.closest('.ftab'); if (!el) return;
      this.codesCurCat = el.dataset.cat;
      document.querySelectorAll('#codes-tabs .ftab').forEach(x => x.classList.toggle('active', x === el));
      this.renderCodesGrid();
    });
    document.getElementById('codes-search').addEventListener('input', e => { this.codesQuery = e.target.value; this.renderCodesGrid(); });
    document.getElementById('codes-grid').addEventListener('click', e => {
      const fav = e.target.closest('.code-fav');
      if (fav) { this.openPopup(fav.dataset.code); return; }
      const card = e.target.closest('.code-card[data-code]');
      if (card) {
        this.closeAllDrawers();
        qi.value = card.dataset.code;
        document.getElementById('btn-clear').style.display = 'block';
        this.applyFilters();
        window.scrollTo({ top: 130, behavior: 'smooth' });
      }
    });

    // Assortiment
    document.getElementById('asst-tabs-cat').addEventListener('click', e => {
      const el = e.target.closest('.ftab'); if (!el) return;
      this.asstCurCat = el.dataset.cat;
      document.querySelectorAll('#asst-tabs-cat .ftab').forEach(x => x.classList.toggle('active', x === el));
      this.renderAsstGrid();
    });
    document.getElementById('asst-tabs-prot').addEventListener('click', e => {
      const ep = e.target.closest('[data-prot]');
      if (ep) { this.asstCurProt = ep.dataset.prot; document.querySelectorAll('[data-prot]').forEach(x => x.classList.toggle('active', x === ep)); this.renderAsstGrid(); return; }
      const eg = e.target.closest('[data-gamme]');
      if (eg) { this.asstCurGamme = eg.dataset.gamme; document.querySelectorAll('[data-gamme]').forEach(x => x.classList.toggle('active', x === eg)); this.renderAsstGrid(); }
    });
    document.getElementById('asst-search').addEventListener('input', e => { this.asstQuery = e.target.value.toLowerCase().trim(); this.renderAsstGrid(); });

    // Recettes
    document.getElementById('recipes-tabs').addEventListener('click', e => {
      const el = e.target.closest('.ftab'); if (!el) return;
      this.recCurCat = el.dataset.cat;
      document.querySelectorAll('#recipes-tabs .ftab').forEach(x => x.classList.toggle('active', x === el));
      this.renderRecipesGrid();
    });
    document.getElementById('recipes-search').addEventListener('input', e => { this.recQuery = e.target.value; this.renderRecipesGrid(); });
    document.getElementById('recipes-grid').addEventListener('click', e => {
      const bf = e.target.closest('.btn-fiche'); if (bf) { this.openFiche(bf.dataset.key); return; }
      const bs = e.target.closest('.btn-select');
      if (bs) { const r = this.getRecipeByKey(bs.dataset.key); if (r) Calculateur.toggle(bs.dataset.key, r); this.renderRecipesGrid(); }
    });

    // Modal fiche
    document.getElementById('modal-fiche').addEventListener('click', e => {
      if (e.target === e.currentTarget || e.target.closest('.modal-close')) { this.closeModal('modal-fiche'); return; }
      const bc = e.target.closest('.btn-catalogue');
      if (bc) {
        this.closeModal('modal-fiche'); this.closeAllDrawers();
        qi.value = bc.dataset.code; document.getElementById('btn-clear').style.display = 'block';
        this.applyFilters(); window.scrollTo({ top: 130, behavior: 'smooth' });
      }
    });

    // Modal calculateur
    document.getElementById('modal-calc').addEventListener('click', e => {
      if (e.target === e.currentTarget || e.target.closest('.modal-close')) { this.closeModal('modal-calc'); return; }
      if (e.target.id === 'btn-compute') { this.renderCalcResult(); return; }
      const rm = e.target.closest('.btn-rm');
      if (rm) { delete Calculateur.selected[rm.dataset.key]; Calculateur.updateBtn(); this.renderRecipesGrid(); this.openCalc(); return; }
      const qi2 = e.target.closest('.qty-input');
      if (qi2) Calculateur.setQty(qi2.dataset.key, qi2.value);
    });

    // Bibliothèques
    document.getElementById('libs-list').addEventListener('click', e => {
      const rm = e.target.closest('.lib-prod-rm');
      if (rm) {
        e.stopPropagation();
        const lib = Libs.all.find(l => l.id === rm.dataset.lib);
        if (lib) { const i = lib.products.findIndex(x => (x.code || x) === rm.dataset.code); if (i >= 0) lib.products.splice(i, 1); }
        Libs.save(); this.renderGrid(); this.renderLibsDrawer();
        this.toast('Produit retiré.', 'var(--danger)'); return;
      }
      const row = e.target.closest('.lib-prod-row[data-code]');
      if (row) {
        this.closeAllDrawers(); qi.value = row.dataset.code;
        document.getElementById('btn-clear').style.display = 'block';
        this.applyFilters(); window.scrollTo({ top: 130, behavior: 'smooth' }); return;
      }
      const head = e.target.closest('[data-lib-toggle]');
      if (head) {
        const id = head.dataset.libToggle;
        const body = document.getElementById(`lib-body-${id}`);
        const arrow = document.getElementById(`lib-arrow-${id}`);
        if (body) { body.classList.toggle('open'); if (arrow) arrow.classList.toggle('open', body.classList.contains('open')); }
      }
    });
    document.getElementById('btn-lib-create').addEventListener('click', () => {
      const name = document.getElementById('lib-name-input').value.trim();
      if (!name) { document.getElementById('lib-name-input').focus(); return; }
      Libs.create(name, this.selectedColor);
      document.getElementById('lib-name-input').value = '';
      document.getElementById('stat-libs').textContent = Libs.all.length;
      this.renderLibsDrawer();
      this.toast('Bibliothèque créée !', 'var(--primary)');
    });
    document.getElementById('lib-name-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('btn-lib-create').click();
    });
    document.getElementById('btn-lib-export').addEventListener('click', () => Libs.exportLibs(this.products));
    document.getElementById('btn-lib-import').addEventListener('click', () => document.getElementById('lib-import-file').click());
    document.getElementById('lib-import-file').addEventListener('change', e => {
      Libs.importLibs(e, () => { this.renderGrid(); this.renderLibsDrawer(); document.getElementById('stat-libs').textContent = Libs.all.length; });
    });
    document.getElementById('btn-lib-reset').addEventListener('click', () => {
      if (!confirm('Réinitialiser toutes les bibliothèques ?')) return;
      Libs.reset(); this.renderGrid(); this.renderLibsDrawer();
      document.getElementById('stat-libs').textContent = Libs.all.length;
      this.toast('Réinitialisé.', 'var(--warning)');
    });
  }
};

/* ══════════════════════════════════════════════
   BIBLIOTHÈQUES (Libs)
══════════════════════════════════════════════ */
const Libs = {
  KEY: 'elior-catalogue-libs-v1',
  all: [],

  init() {
    try { const r = localStorage.getItem(this.KEY); this.all = r ? JSON.parse(r) : this.defaultLibs(); }
    catch (e) { this.all = this.defaultLibs(); }
  },
  defaultLibs() { return [{ id: 'lib-default', name: 'Favoris', color: '#1B6B8A', products: [] }]; },
  save() { try { localStorage.setItem(this.KEY, JSON.stringify(this.all)); } catch (e) {} },
  create(name, color) { this.all.push({ id: 'lib-' + Date.now(), name, color, products: [] }); this.save(); },
  reset() { this.all = this.defaultLibs(); this.save(); },

  exportLibs(products) {
    const active = this.all.filter(l => l.products.length > 0);
    if (!active.length) { App.toast('Aucun produit dans les bibliothèques.', 'var(--danger)'); return; }
    const data = {
      exportedAt: new Date().toISOString().slice(0, 10),
      libraries: active.map(lib => ({
        id: lib.id, name: lib.name, color: lib.color,
        products: lib.products.map(e => { const code = e.code || e; const p = products.find(x => x.articleCode === code); return p || { articleCode: code }; }).filter(Boolean)
      }))
    };
    const a = document.createElement('a');
    a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(data, null, 2));
    a.download = 'bibliotheques-elior.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    App.toast('Export téléchargé !', 'var(--success)');
  },

  importLibs(event, onDone) {
    const file = event.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result); let count = 0;
        const toP = arr => arr.map(p => ({ code: p.articleCode }));
        const merge = ld => {
          const ex = this.all.find(l => l.id === ld.id);
          const name = ld.library || ld.name;
          if (ex) { if (!confirm(`Remplacer "${name}" ?`)) return; ex.name = name; ex.color = ld.color || ex.color; ex.products = toP(ld.products); }
          else this.all.push({ id: ld.id || ('lib-' + Date.now()), name, color: ld.color || '#1B6B8A', products: toP(ld.products) });
          count++;
        };
        if (data.library && data.products) merge(data);
        else if (data.libraries) data.libraries.forEach(merge);
        this.save();
        if (count > 0) { if (onDone) onDone(); App.toast(`${count} bibliothèque(s) importée(s) !`, 'var(--success)'); }
        else App.toast('Format non reconnu.', 'var(--danger)');
      } catch { App.toast('Erreur lecture JSON.', 'var(--danger)'); }
      event.target.value = '';
    };
    reader.readAsText(file);
  }
};
