<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Catalogue Fournisseurs</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
:root{--bg:#0f1117;--sur:#1a1d27;--sur2:#22263a;--sur3:#282d42;--brd:#2e3347;--acc:#5b7fff;--gld:#ffd166;--txt:#e8eaf6;--t2:#8a91b4;--t3:#5a6080;--grn:#4ade80;--red:#f87171;--r:12px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;}
header{background:var(--sur);border-bottom:1px solid var(--brd);padding:0 20px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300;}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1rem;}
.lbox{width:32px;height:32px;background:linear-gradient(135deg,var(--acc),#8b5cf6);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.95rem;}
.hs{display:flex;gap:10px;font-size:.76rem;}
.pill{background:var(--sur2);border:1px solid var(--brd);padding:3px 10px;border-radius:20px;font-family:'DM Mono',monospace;color:var(--t2);}
.pill b{color:var(--acc);}
.sbr{background:var(--sur);border-bottom:1px solid var(--brd);padding:9px 20px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;position:sticky;top:58px;z-index:299;}
.sw{flex:1;min-width:200px;position:relative;}
.sw svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.4;pointer-events:none;}
.sbr input{width:100%;background:var(--sur2);border:1px solid var(--brd);border-radius:var(--r);padding:8px 12px 8px 36px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:.88rem;outline:none;transition:border-color .2s;}
.sbr input:focus{border-color:var(--acc);}
.sbr input::placeholder{color:var(--t3);}
.sbr select{background:var(--sur2);border:1px solid var(--brd);border-radius:var(--r);padding:8px 11px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:.84rem;outline:none;cursor:pointer;}
.topbtn{display:inline-flex;align-items:center;gap:6px;background:var(--sur2);border:1px solid rgba(139,92,246,.4);border-radius:var(--r);padding:8px 13px;color:#a78bfa;font-family:'DM Sans',sans-serif;font-size:.84rem;cursor:pointer;transition:all .2s;white-space:nowrap;}
.topbtn:hover{border-color:#8b5cf6;background:rgba(139,92,246,.08);}
.lay{display:flex;min-height:calc(100vh - 116px);}
.sid{width:380px;flex-shrink:0;background:var(--sur);border-right:1px solid var(--brd);padding:14px 0;overflow-y:auto;max-height:calc(100vh - 116px);position:sticky;top:116px;align-self:flex-start;}
.st{font-size:.66rem;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--t3);padding:0 16px 10px;}
.si{padding:9px 16px;cursor:pointer;font-size:.84rem;color:var(--t2);display:flex;justify-content:space-between;align-items:center;gap:10px;border-left:3px solid transparent;transition:all .15s;}
.si:hover{background:var(--sur2);color:var(--txt);}
.si.on{border-left-color:var(--acc);background:rgba(91,127,255,.08);color:var(--acc);}
.si .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3;}
.sc{background:var(--sur2);border-radius:8px;padding:2px 8px;font-size:.69rem;font-family:'DM Mono',monospace;color:var(--t3);flex-shrink:0;}
.si.on .sc{background:rgba(91,127,255,.2);color:var(--acc);}
.con{flex:1;padding:16px 20px;min-width:0;}
.rb{margin-bottom:14px;font-size:.79rem;color:var(--t3);}
.rb em{color:var(--acc);font-style:normal;font-weight:600;font-family:'DM Mono',monospace;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px;}
.card{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);padding:13px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s,transform .15s,box-shadow .2s;position:relative;overflow:hidden;}
.card:hover{border-color:rgba(91,127,255,.4);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3);}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--acc),#8b5cf6);opacity:0;transition:opacity .2s;}
.card:hover::before{opacity:1;}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.stg{font-size:.64rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--acc);background:rgba(91,127,255,.1);border-radius:6px;padding:2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:195px;}
.favbtn{background:none;border:none;cursor:pointer;font-size:1rem;line-height:1;padding:3px 5px;color:var(--t3);transition:all .2s;border-radius:6px;flex-shrink:0;}
.favbtn:hover{color:var(--gld);background:rgba(255,209,102,.1);}
.favbtn.hasfav{color:var(--gld);}
.cn{font-size:.85rem;font-weight:500;line-height:1.33;color:var(--txt);min-height:34px;}
.cm{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;border-top:1px solid var(--brd);padding-top:8px;}
.ml{font-size:.62rem;text-transform:uppercase;letter-spacing:.4px;color:var(--t3);}
.mv{color:var(--t2);font-family:'DM Mono',monospace;font-size:.74rem;}
.cprice{font-size:1rem;font-weight:700;color:var(--grn);font-family:'DM Mono',monospace;}
.cprice .pu{font-size:.68rem;font-weight:400;color:var(--t3);}
.np{color:var(--t3);font-size:.76rem;font-style:italic;}
.ftags{display:flex;flex-wrap:wrap;gap:4px;margin-top:1px;}
.ftag{font-size:.63rem;padding:2px 7px;border-radius:10px;font-weight:600;white-space:nowrap;}
.pag{display:flex;justify-content:center;gap:5px;margin-top:24px;flex-wrap:wrap;padding-bottom:20px;}
.pag button{background:var(--sur);border:1px solid var(--brd);color:var(--t2);border-radius:8px;padding:5px 11px;cursor:pointer;font-family:'DM Mono',monospace;font-size:.79rem;transition:all .15s;}
.pag button:hover{border-color:var(--acc);color:var(--acc);}
.pag button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;}
.pdot{color:var(--t3);padding:5px 2px;font-size:.79rem;align-self:center;}
.empty{text-align:center;padding:70px 20px;color:var(--t3);grid-column:1/-1;}
.empty .ei{font-size:3rem;margin-bottom:10px;}
.empty h3{font-size:.92rem;color:var(--t2);}
/* POPUP */
.pop-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:800;display:none;align-items:center;justify-content:center;}
.pop-ov.open{display:flex;}
.pop{background:var(--sur);border:1px solid var(--brd);border-radius:16px;padding:20px;width:330px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pIn .18s ease;}
@keyframes pIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.pop-title{font-size:.9rem;font-weight:700;margin-bottom:6px;}
.pop-sub{font-size:.76rem;color:var(--t3);margin-bottom:14px;line-height:1.4;}
.pop-sub em{color:var(--txt);font-style:normal;font-weight:500;}
.pop-libs{display:flex;flex-direction:column;gap:6px;max-height:230px;overflow-y:auto;margin-bottom:14px;}
.lib-opt{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--sur2);border:1px solid var(--brd);border-radius:9px;cursor:pointer;transition:all .15s;user-select:none;}
.lib-opt:hover{border-color:var(--acc);}
.lib-opt.sel{border-color:var(--gld);background:rgba(255,209,102,.06);}
.lib-opt .odot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
.lib-opt .oname{flex:1;font-size:.84rem;}
.lib-opt .ocheck{font-size:.9rem;color:var(--gld);width:16px;text-align:center;}
.pop-acts{display:flex;gap:8px;}
.pop-cancel{flex:1;background:none;border:1px solid var(--brd);border-radius:8px;padding:8px;color:var(--t2);font-family:'DM Sans',sans-serif;font-size:.84rem;cursor:pointer;}
.pop-cancel:hover{border-color:var(--txt);color:var(--txt);}
.pop-ok{flex:1;background:var(--acc);border:none;border-radius:8px;padding:8px;color:#fff;font-family:'DM Sans',sans-serif;font-size:.84rem;font-weight:600;cursor:pointer;}
.pop-ok:hover{opacity:.85;}
/* PANNEAU */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:900;display:none;}
.overlay.open{display:flex;align-items:flex-start;justify-content:flex-end;}
.modal{background:var(--sur);border-left:1px solid var(--brd);width:460px;height:100vh;display:flex;flex-direction:column;animation:sli .2s ease;}
@keyframes sli{from{transform:translateX(100%)}to{transform:none}}
.mhead{padding:15px 18px;border-bottom:1px solid var(--brd);display:flex;justify-content:space-between;align-items:center;}
.mhead h2{font-size:.95rem;font-weight:700;}
.mclose{background:none;border:none;cursor:pointer;color:var(--t3);font-size:1.2rem;padding:4px 6px;border-radius:6px;}
.mclose:hover{color:var(--txt);background:var(--sur2);}
.mbody{flex:1;overflow-y:auto;padding:14px 16px;}
.libcard{background:var(--sur2);border:1px solid var(--brd);border-radius:10px;margin-bottom:8px;overflow:hidden;}
.libhead{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;transition:background .15s;user-select:none;}
.libhead:hover{background:var(--sur3);}
.lcol{width:13px;height:13px;border-radius:50%;flex-shrink:0;}
.lname{flex:1;font-size:.88rem;font-weight:500;}
.lbadge{font-size:.7rem;font-family:'DM Mono',monospace;color:var(--t3);background:var(--sur3);border-radius:8px;padding:2px 8px;}
.larrow{font-size:.7rem;color:var(--t3);transition:transform .2s;margin-left:4px;}
.larrow.open{transform:rotate(90deg);}
.libprods{display:none;border-top:1px solid var(--brd);}
.libprods.open{display:block;}
.lprow{display:flex;align-items:flex-start;gap:10px;padding:9px 13px;border-bottom:1px solid var(--brd);}
.lprow:last-child{border:none;}
.lpbar{width:4px;border-radius:2px;min-height:40px;flex-shrink:0;margin-top:2px;}
.lpinfo{flex:1;min-width:0;}
.lpd{font-size:.8rem;color:var(--txt);font-weight:500;line-height:1.3;}
.lpm{font-size:.7rem;color:var(--t3);margin-top:2px;}
.lpp{font-size:.76rem;color:var(--grn);font-family:'DM Mono',monospace;margin-top:3px;}
.lpx{background:none;border:none;cursor:pointer;color:var(--t3);font-size:.8rem;padding:3px 7px;border-radius:5px;flex-shrink:0;transition:all .15s;margin-top:1px;}
.lpx:hover{background:rgba(248,113,113,.12);color:var(--red);}
.libempty{font-size:.78rem;color:var(--t3);padding:12px 13px;font-style:italic;}
.newform{background:var(--sur2);border:1px solid var(--brd);border-radius:10px;padding:13px;margin-bottom:14px;}
.newform h3{font-size:.75rem;font-weight:600;color:var(--t3);margin-bottom:10px;text-transform:uppercase;letter-spacing:.8px;}
.newform input{width:100%;background:var(--sur);border:1px solid var(--brd);border-radius:8px;padding:8px 10px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:.85rem;outline:none;margin-bottom:10px;}
.newform input:focus{border-color:var(--acc);}
.cpicker{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px;}
.csw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s;}
.csw.on{border-color:#fff;transform:scale(1.15);}
.bcreate{width:100%;background:var(--acc);border:none;border-radius:8px;padding:9px;color:#fff;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;}
.bcreate:hover{opacity:.85;}
.actsec{padding-top:14px;border-top:1px solid var(--brd);}
.actsec h3{font-size:.75rem;font-weight:600;color:var(--t3);margin-bottom:10px;text-transform:uppercase;letter-spacing:.8px;}
.dlrow{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--sur2);border:1px solid var(--brd);border-radius:8px;margin-bottom:6px;}
.dlinfo{flex:1;min-width:0;}
.dlname{font-size:.82rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dlcnt{font-size:.68rem;color:var(--t3);font-family:'DM Mono',monospace;}
.dlbtn{background:none;border:1px solid var(--brd);border-radius:7px;padding:5px 10px;color:var(--t2);font-size:.75rem;cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0;}
.dlbtn:hover{border-color:var(--grn);color:var(--grn);}
.dlbtn:disabled{opacity:.35;cursor:default;}
.actrow{display:flex;gap:8px;margin-top:10px;}
.abtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;border:none;transition:all .2s;}
.abtn.dl{background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.3);color:var(--grn);}
.abtn.dl:hover{background:rgba(74,222,128,.16);}
.abtn.imp{background:rgba(91,127,255,.08);border:1px solid rgba(91,127,255,.3);color:var(--acc);}
.abtn.imp:hover{background:rgba(91,127,255,.16);}
.abtn.rst{background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.25);color:var(--red);}
.abtn.rst:hover{background:rgba(248,113,113,.14);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--sur3);border:1px solid var(--brd);border-radius:10px;padding:10px 20px;font-size:.84rem;color:var(--txt);z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.4);white-space:nowrap;}
.toast.show{opacity:1;}
#impFile{display:none;}
@media(max-width:800px){.sid{display:none;}.hs{display:none;}.modal{width:100vw;}}
</style>
</head>
<body>

<header>
  <div class="logo"><div class="lbox">&#128230;</div>Catalogue Fournisseurs</div>
  <div class="hs">
    <div class="pill">Produits&nbsp;<b id="tprod">-</b></div>
    <div class="pill">Fournisseurs&nbsp;<b id="tsup">-</b></div>
    <div class="pill">Biblioth&egrave;ques&nbsp;<b id="tlibs">0</b></div>
  </div>
</header>

<div class="sbr">
  <div class="sw">
    <svg width="14" height="14" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="Q" placeholder="D&#233;signation, code article, r&#233;f&#233;rence fournisseur..." autocomplete="off"/>
  </div>
  <select id="SORT">
    <option value="n">Nom A&#8594;Z</option>
    <option value="nd">Nom Z&#8594;A</option>
    <option value="pa">Prix &#8593;</option>
    <option value="pd">Prix &#8595;</option>
    <option value="c">Code article</option>
  </select>
  <button class="topbtn" id="LIBSBTN">&#128218; Biblioth&egrave;ques <span id="lbadge" style="background:#8b5cf6;color:#fff;border-radius:10px;padding:1px 7px;font-size:.72rem;font-weight:700;margin-left:2px">0</span></button>
</div>

<div class="lay">
  <div class="sid"><div class="st">Fournisseurs</div><div id="SL"></div></div>
  <div class="con">
    <div class="rb"><div id="RI"></div></div>
    <div class="grid" id="PG"></div>
    <div class="pag" id="PAG"></div>
  </div>
</div>

<!-- POPUP choix bibliothèque -->
<div class="pop-ov" id="POP">
  <div class="pop">
    <div class="pop-title">&#11088; Ajouter aux favoris</div>
    <div class="pop-sub" id="PSUB"></div>
    <div class="pop-libs" id="PLIBS"></div>
    <div class="pop-acts">
      <button class="pop-cancel" id="PCANCEL">Annuler</button>
      <button class="pop-ok" id="POK">Confirmer</button>
    </div>
  </div>
</div>

<!-- PANNEAU bibliothèques -->
<div class="overlay" id="OV">
  <div class="modal">
    <div class="mhead"><h2>&#128218; Mes biblioth&egrave;ques</h2><button class="mclose" id="MCLOSE">&#10005;</button></div>
    <div class="mbody">
      <div id="LIBLIST"></div>
      <div class="newform">
        <h3>+ Nouvelle biblioth&egrave;que</h3>
        <input type="text" id="NEWNAME" placeholder="Ex: Commande semaine, Poissons frais..."/>
        <div class="cpicker" id="CPICK"></div>
        <button class="bcreate" id="BCREATE">Cr&#233;er la biblioth&egrave;que</button>
      </div>
      <div class="actsec">
        <h3>&#8595; T&#233;l&#233;charger par biblioth&egrave;que</h3>
        <div id="DLLIST"></div>
        <h3 style="margin-top:14px">Actions globales</h3>
        <div class="actrow">
          <button class="abtn dl" id="DLALL">&#8595; Tout exporter</button>
          <button class="abtn imp" id="IMPBTN">&#8593; Importer JSON</button>
        </div>
        <div class="actrow">
          <button class="abtn rst" id="RSTBTN">&#128465; R&#233;initialiser</button>
        </div>
        <input type="file" id="impFile" accept=".json"/>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="TOAST"></div>

<script>
// ── APP ── (données chargées via data.js qui appelle window._onCatData)
window._onCatData = function() {
  var D = window._CAT_DATA.D;
  var SUPS = window._CAT_DATA.SUPS;
  var PER=30, fil=[], pg=1, curSup='all';
  var COLS=['#ffd166','#4ade80','#5b7fff','#f87171','#a78bfa','#fb923c','#34d399','#f472b6','#60a5fa','#facc15'];
  var selCol=COLS[0], popCode=null, popSnap=null;

  function loadLibs(){try{var r=localStorage.getItem('cf_L7');if(r)return JSON.parse(r);}catch(e){}return [{id:'lib0',name:'Favoris',color:'#ffd166',products:[]}];}
  var libs=loadLibs();
  function saveLibs(){try{localStorage.setItem('cf_L7',JSON.stringify(libs));}catch(e){}}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function toast(msg,col){var t=document.getElementById('TOAST');t.innerHTML=msg;t.style.borderColor=col||'var(--brd)';t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}

  // SIDEBAR
  function buildSidebar(){
    var cnt={};D.forEach(function(p){cnt[p.supplierName]=(cnt[p.supplierName]||0)+1;});
    var h='<div class="si on" data-i="-1"><span class="nm">Tous les fournisseurs</span><span class="sc">'+D.length+'</span></div>';
    SUPS.forEach(function(n,i){h+='<div class="si" data-i="'+i+'"><span class="nm">'+esc(n)+'</span><span class="sc">'+(cnt[n]||0)+'</span></div>';});
    document.getElementById('SL').innerHTML=h;
    document.getElementById('SL').addEventListener('click',function(e){
      var el=e.target.closest('.si');if(!el)return;
      curSup=parseInt(el.dataset.i)===-1?'all':SUPS[parseInt(el.dataset.i)];
      document.querySelectorAll('.si').forEach(function(x){x.classList.toggle('on',x===el);});
      pg=1;applyFilters();
    });
  }

  // FILTRES
  function applyFilters(){
    var q=document.getElementById('Q').value.toLowerCase().trim();
    var s=document.getElementById('SORT').value;
    fil=D.filter(function(p){
      if(curSup!=='all'&&p.supplierName!==curSup)return false;
      if(!q)return true;
      return(p.designation||'').toLowerCase().indexOf(q)>=0||(p.articleCode||'').toLowerCase().indexOf(q)>=0||(p.supplierArticleNumber||'').toLowerCase().indexOf(q)>=0||(p.supplierName||'').toLowerCase().indexOf(q)>=0;
    });
    fil.sort(function(a,b){
      if(s==='pa')return(a.unitPrice||0)-(b.unitPrice||0);if(s==='pd')return(b.unitPrice||0)-(a.unitPrice||0);
      if(s==='c')return(a.articleCode||'').localeCompare(b.articleCode||'');if(s==='nd')return(b.designation||'').localeCompare(a.designation||'');
      return(a.designation||'').localeCompare(b.designation||'');
    });
    pg=1;renderGrid();
  }

  function libsOf(code){return libs.filter(function(l){return l.products.some(function(e){return(e.code||e)===code;});});}

  // GRILLE
  function renderGrid(){
    var s=(pg-1)*PER, data=fil.slice(s,s+PER);
    document.getElementById('RI').innerHTML='<em>'+fil.length+'</em> produit(s)'+(curSup!=='all'?' &mdash; '+esc(curSup):'');
    if(!data.length){document.getElementById('PG').innerHTML='<div class="empty"><div class="ei">&#128269;</div><h3>Aucun r&eacute;sultat</h3></div>';document.getElementById('PAG').innerHTML='';return;}
    document.getElementById('PG').innerHTML=data.map(function(p){
      var ml=libsOf(p.articleCode),hf=ml.length>0,code=esc(p.articleCode);
      var price=p.unitPrice!=null?'<div class="cprice">'+p.unitPrice.toFixed(3)+' &euro;<span class="pu"> / '+esc(p.unitOfInvoice)+'</span></div>':'<div class="np">Prix N/C</div>';
      var tags=ml.map(function(l){return'<span class="ftag" style="background:'+l.color+'22;color:'+l.color+';border:1px solid '+l.color+'55">'+esc(l.name)+'</span>';}).join('');
      return'<div class="card"><div class="ch"><div class="stg">'+esc(p.supplierName)+'</div><button class="favbtn'+(hf?' hasfav':'')+'" data-code="'+code+'">'+(hf?'&#11088;':'&#9734;')+'</button></div><div class="cn">'+esc(p.designation||'-')+'</div><div class="cm"><div><div class="ml">Code art.</div><div class="mv">'+esc(p.articleCode||'-')+'</div></div><div><div class="ml">R&eacute;f. fourn.</div><div class="mv">'+esc(p.supplierArticleNumber||'-')+'</div></div><div><div class="ml">U. vente</div><div class="mv">'+esc(p.unitOfSale||'-')+'</div></div><div><div class="ml">U. fact.</div><div class="mv">'+esc(p.unitOfInvoice||'-')+'</div></div></div>'+(tags?'<div class="ftags">'+tags+'</div>':'')+price+'</div>';
    }).join('');
    renderPag();
  }

  document.getElementById('PG').addEventListener('click',function(e){var fb=e.target.closest('.favbtn');if(!fb)return;openPop(fb.dataset.code);});

  function renderPag(){
    var tot=Math.ceil(fil.length/PER),el=document.getElementById('PAG');
    if(tot<=1){el.innerHTML='';return;}
    var o='';
    if(pg>1)o+='<button onclick="gp('+(pg-1)+')">&#8592; Pr&eacute;c.</button>';
    for(var i=1;i<=tot;i++){if(i===1||i===tot||Math.abs(i-pg)<=2)o+='<button class="'+(i===pg?'on':'')+'" onclick="gp('+i+')">'+i+'</button>';else if(Math.abs(i-pg)===3)o+='<span class="pdot">&#8230;</span>';}
    if(pg<tot)o+='<button onclick="gp('+(pg+1)+')">Suiv. &#8594;</button>';
    el.innerHTML=o;
  }
  window.gp=function(n){pg=n;renderGrid();window.scrollTo({top:115,behavior:'smooth'});};

  // POPUP
  function openPop(code){
    popCode=code;popSnap={};
    var p=D.find(function(x){return x.articleCode===code;});
    document.getElementById('PSUB').innerHTML='<em>'+esc(p?p.designation:code)+'</em><br>Choisissez vos biblioth&egrave;ques&nbsp;:';
    libs.forEach(function(l){popSnap[l.id]=l.products.some(function(e){return(e.code||e)===code;});});
    var el=document.getElementById('PLIBS');
    if(!libs.length){el.innerHTML='<div style="font-size:.8rem;color:var(--t3);text-align:center;padding:10px">Cr&eacute;ez d\'abord une biblioth&egrave;que</div>';}
    else{
      el.innerHTML=libs.map(function(l){var sel=!!popSnap[l.id];return'<div class="lib-opt'+(sel?' sel':'')+'" data-lid="'+l.id+'"><span class="odot" style="background:'+l.color+'"></span><span class="oname">'+esc(l.name)+'</span><span class="ocheck">'+(sel?'&#10003;':'')+'</span></div>';}).join('');
      el.querySelectorAll('.lib-opt').forEach(function(opt){opt.addEventListener('click',function(){var lid=opt.dataset.lid;popSnap[lid]=!popSnap[lid];opt.classList.toggle('sel',popSnap[lid]);opt.querySelector('.ocheck').innerHTML=popSnap[lid]?'&#10003;':'';});});
    }
    document.getElementById('POP').classList.add('open');
  }
  function closePop(){document.getElementById('POP').classList.remove('open');popCode=null;popSnap=null;}
  document.getElementById('PCANCEL').addEventListener('click',closePop);
  document.getElementById('POP').addEventListener('click',function(e){if(e.target===this)closePop();});
  document.getElementById('POK').addEventListener('click',function(){
    if(!popCode||!popSnap)return;
    var code=popCode;
    libs.forEach(function(l){
      var was=l.products.some(function(e){return(e.code||e)===code;});
      var want=!!popSnap[l.id];
      if(want&&!was)l.products.push({code:code});
      else if(!want&&was){var i=l.products.findIndex(function(e){return(e.code||e)===code;});if(i>=0)l.products.splice(i,1);}
    });
    saveLibs();updBadge();renderGrid();
    if(document.getElementById('OV').classList.contains('open'))renderModal();
    closePop();toast('Favoris mis &agrave; jour !','var(--gld)');
  });

  // PANNEAU
  function openModal(){renderModal();document.getElementById('OV').classList.add('open');}
  function closeModal(){document.getElementById('OV').classList.remove('open');}
  document.getElementById('OV').addEventListener('click',function(e){if(e.target===this)closeModal();});

  function renderModal(){
    var html=libs.length===0?'<div style="font-size:.82rem;color:var(--t3);padding:8px 0 14px">Aucune biblioth&egrave;que.</div>':libs.map(function(lib){
      var rows=lib.products.map(function(entry){
        var code=entry.code||entry;var p=D.find(function(x){return x.articleCode===code;});if(!p)return'';
        var pr=p.unitPrice!=null?p.unitPrice.toFixed(3)+' &#8364; / '+esc(p.unitOfInvoice):'N/C';
        return'<div class="lprow"><div class="lpbar" style="background:'+lib.color+'"></div><div class="lpinfo"><div class="lpd">'+esc(p.designation||code)+'</div><div class="lpm">'+esc(p.supplierName)+' &mdash; '+esc(p.articleCode)+(p.supplierArticleNumber?' &mdash; '+esc(p.supplierArticleNumber):'')+'</div><div class="lpp">'+pr+'</div></div><button class="lpx" data-lib="'+lib.id+'" data-code="'+esc(code)+'">&#10005;</button></div>';
      }).filter(Boolean).join('');
      return'<div class="libcard"><div class="libhead" onclick="tExp(\''+lib.id+'\')">'+'<span class="lcol" style="background:'+lib.color+'"></span><span class="lname">'+esc(lib.name)+'</span><span class="lbadge">'+lib.products.length+'</span><span class="larrow" id="la'+lib.id+'">&#9654;</span></div>'+'<div class="libprods" id="lp'+lib.id+'">'+(rows||'<div class="libempty">Aucun produit</div>')+'</div></div>';
    }).join('');
    document.getElementById('LIBLIST').innerHTML=html;

    document.getElementById('DLLIST').innerHTML=libs.map(function(lib){
      return'<div class="dlrow"><span class="lcol" style="background:'+lib.color+'"></span><div class="dlinfo"><div class="dlname">'+esc(lib.name)+'</div><div class="dlcnt">'+lib.products.length+' produit(s)</div></div><button class="dlbtn" onclick="dlLib(\''+lib.id+'\')"'+(lib.products.length===0?' disabled':'')+'>&#8595; JSON</button></div>';
    }).join('')||'<div style="font-size:.78rem;color:var(--t3)">Cr&eacute;ez une biblioth&egrave;que d\'abord</div>';
  }
  window.tExp=function(id){var el=document.getElementById('lp'+id),ar=document.getElementById('la'+id);if(el){el.classList.toggle('open');if(ar)ar.classList.toggle('open',el.classList.contains('open'));}};

  // CRÉER
  (function(){COLS.forEach(function(c,i){var sw=document.createElement('div');sw.className='csw'+(i===0?' on':'');sw.style.background=c;sw.addEventListener('click',function(){selCol=c;document.querySelectorAll('.csw').forEach(function(x){x.classList.toggle('on',x===sw);});});document.getElementById('CPICK').appendChild(sw);});})();
  document.getElementById('BCREATE').addEventListener('click',function(){var name=document.getElementById('NEWNAME').value.trim();if(!name){document.getElementById('NEWNAME').focus();return;}libs.push({id:'L'+Date.now(),name:name,color:selCol,products:[]});saveLibs();updBadge();document.getElementById('NEWNAME').value='';renderModal();toast('Biblioth\u00e8que cr\u00e9\u00e9e !','var(--acc)');});
  document.getElementById('NEWNAME').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('BCREATE').click();});

  // EXPORT
  function buildExp(lib){return{library:lib.name,color:lib.color,id:lib.id,exportedAt:new Date().toISOString().slice(0,10),totalProducts:lib.products.length,products:lib.products.map(function(e){var code=e.code||e;var p=D.find(function(x){return x.articleCode===code;});return p||{articleCode:code};}).filter(Boolean)};}
  window.dlLib=function(id){var lib=libs.find(function(l){return l.id===id;});if(!lib||!lib.products.length)return;dlJ(JSON.stringify(buildExp(lib),null,2),lib.name.replace(/[^a-z0-9_-]/gi,'_')+'.json');toast('T\u00e9l\u00e9charg\u00e9 !','var(--grn)');};
  document.getElementById('DLALL').addEventListener('click',function(){var a=libs.filter(function(l){return l.products.length>0;});if(!a.length){toast('Aucun produit.','var(--red)');return;}dlJ(JSON.stringify({exportedAt:new Date().toISOString().slice(0,10),libraries:a.map(buildExp)},null,2),'bibliotheques_catalogue.json');toast('Export t\u00e9l\u00e9charg\u00e9 !','var(--grn)');});
  function dlJ(c,n){var a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(c);a.download=n;document.body.appendChild(a);a.click();document.body.removeChild(a);}

  // IMPORT
  document.getElementById('IMPBTN').addEventListener('click',function(){document.getElementById('impFile').click();});
  document.getElementById('impFile').addEventListener('change',function(e){
    var file=e.target.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var data=JSON.parse(ev.target.result);var count=0;
        function toP(arr){return arr.map(function(p){return{code:p.articleCode};});}
        function merge(ld){var ex=libs.find(function(l){return l.id===ld.id;});if(ex){if(!confirm('Remplacer "'+ld.library+'" ?'))return;ex.name=ld.library;ex.color=ld.color||ex.color;ex.products=toP(ld.products);}else libs.push({id:ld.id||('L'+Date.now()),name:ld.library,color:ld.color||COLS[0],products:toP(ld.products)});count++;}
        if(data.library&&data.products)merge(data);else if(data.libraries)data.libraries.forEach(merge);
        if(count){saveLibs();updBadge();renderGrid();renderModal();toast(count+' import\u00e9e(s) !','var(--grn)');}else toast('Format non reconnu.','var(--red)');
      }catch(err){toast('Erreur JSON.','var(--red)');}
      e.target.value='';
    };reader.readAsText(file);
  });

  // RESET
  document.getElementById('RSTBTN').addEventListener('click',function(){if(!confirm('R\u00e9initialiser ?'))return;libs=[{id:'lib0',name:'Favoris',color:'#ffd166',products:[]}];saveLibs();updBadge();renderGrid();renderModal();toast('R\u00e9initialis\u00e9.','var(--gld)');});

  function updBadge(){document.getElementById('tlibs').textContent=libs.length;document.getElementById('lbadge').textContent=libs.length;}

  // INIT
  // Suppression produit — event delegation permanent sur le conteneur fixe mbody
  document.querySelector('.mbody').addEventListener('click',function(e){
    var btn=e.target.closest('.lpx');if(!btn)return;
    var lib=libs.find(function(l){return l.id===btn.dataset.lib;});
    if(lib){var i=lib.products.findIndex(function(x){return(x.code||x)===btn.dataset.code;});if(i>=0)lib.products.splice(i,1);}
    saveLibs();updBadge();renderGrid();renderModal();
    // Rouvrir le panneau qui vient d'être re-rendu
    var lpEl=document.getElementById('lp'+btn.dataset.lib);
    var arEl=document.getElementById('la'+btn.dataset.lib);
    if(lpEl){lpEl.classList.add('open');if(arEl)arEl.classList.add('open');}
    toast('Produit retir&eacute; de la biblioth&egrave;que.','var(--red)');
  });
  document.getElementById('LIBSBTN').addEventListener('click',openModal);
  document.getElementById('MCLOSE').addEventListener('click',closeModal);
  document.getElementById('Q').addEventListener('input',function(){pg=1;applyFilters();});
  document.getElementById('SORT').addEventListener('change',applyFilters);
  document.getElementById('tprod').textContent=D.length;
  document.getElementById('tsup').textContent=SUPS.length;
  buildSidebar();updBadge();applyFilters();
};
</script>
<script src="data.js"></script>
</body>
</html>
